<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BATTLE ARENA - สนามต่อสู้</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            background: #050508; 
            color: #fff; 
            overflow: hidden;
            user-select: none;
        }

        /* Arena Canvas Viewport */
        .battle-stage {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #080811 100%);
            position: relative;
            overflow: hidden;
        }

        /* Grid Effect Background */
        .grid-bg {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(rgba(255, 200, 49, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 200, 49, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(45deg);
            pointer-events: none;
        }

        /* Top HUD Layout */
        .top-hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-start;
            gap: 15px;
            z-index: 10;
            background: rgba(10, 10, 18, 0.85);
            padding: 12px 25px;
            border-radius: 40px;
            border: 2px solid rgba(255, 200, 49, 0.4);
            backdrop-filter: blur(8px);
            min-width: 550px;
            justify-content: space-between;
        }

        .player-info { 
            text-align: left; 
            flex: 1; 
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .enemy-info { 
            text-align: right; 
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        /* Team HP Bar Styles */
        .team-hp-bar {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
        }

        .team-hp-fill { height: 100%; transition: width 0.2s ease; }
        .player-hp-fill { background: linear-gradient(90deg, #00ff88, #10b981); width: 100%; }
        .enemy-hp-fill { background: linear-gradient(90deg, #ef4444, #f87171); width: 100%; }

        /* Shield Layer Style */
        .shield-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            box-shadow: 0 0 8px #00d2ff;
            transition: width 0.2s ease;
        }

        /* Status บัฟเร่งสปีด แสดงไว้ใต้หลอดเลือดของทีมผู้ท้าชน */
        .team-speed-buff-tag {
            display: none; /* ซ่อนไว้ก่อน จะแสดงเมื่อกดใช้ไอเทม */
            margin-top: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            border: 1px solid #ff0055;
            padding: 3px 10px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
            animation: buffPulse 0.8s infinite alternate;
            white-space: nowrap;
        }

        @keyframes buffPulse {
            from { opacity: 0.85; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1.03); }
        }

        .center-hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .vs-badge { 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: #ef4444; 
            text-shadow: 0 0 10px #ef4444; 
            line-height: 1;
        }

        .timer-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffc831;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 200, 49, 0.3);
            margin-top: 4px;
            font-family: monospace;
        }

        /* Countdown Overlay */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .countdown-text {
            font-size: 5rem;
            font-weight: 900;
            color: #ffc831;
            text-shadow: 0 0 30px rgba(255, 200, 49, 0.8);
            animation: pulseText 0.8s infinite alternate;
            text-align: center;
        }

        @keyframes pulseText {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* 2D Battle Field Containers */
        .field { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

        /* Card Unit Styles */
        .battle-unit {
            width: 90px;
            height: 130px;
            background: #111;
            border-radius: 12px;
            position: absolute;
            border: 2px solid #ffc831;
            box-shadow: 0 0 15px rgba(255, 200, 49, 0.4);
            transition: transform 0.1s ease, border-color 0.3s, box-shadow 0.3s;
            overflow: visible;
        }

        .battle-unit.enemy {
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .battle-unit img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }

        .battle-unit .unit-lv {
            position: absolute;
            top: -10px;
            right: -6px;
            background: #ffc831;
            color: #000;
            font-weight: 900;
            font-size: 0.65rem;
            padding: 2px 5px;
            border-radius: 4px;
            z-index: 5;
        }

        /* Aura เรืองแสงเวลาตัวละครติดบัฟสปีด */
        .battle-unit.speed-buffed {
            border-color: #ff0055 !important;
            box-shadow: 0 0 20px #ff0055, inset 0 0 10px #ff9000 !important;
        }

        /* Health Bar Unit */
        .hp-bar-container {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
        }

        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #10b981);
            width: 100%;
            transition: width 0.2s ease;
        }

        .unit-shield-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            transition: width 0.2s ease;
        }

        .battle-unit.enemy .hp-bar-fill {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }

        /* Floating Damage Text */
        .damage-pop {
            position: absolute;
            font-size: 1.4rem;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 6px #000;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
        }

        /* Item Container UI */
        .item-hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .item-btn {
            background: rgba(10, 10, 18, 0.85);
            border: 2px solid #ffc831;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Kanit', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 200, 49, 0.4);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }

        .item-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background: #ffc831;
            color: #000;
        }

        .item-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }

        /* Result Panel */
        .result-panel {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 10, 0.92);
            z-index: 200;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .result-card {
            background: rgba(20, 20, 35, 0.85);
            border: 2px solid rgba(255, 200, 49, 0.3);
            border-radius: 24px;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            min-width: 400px;
        }

        .result-title {
            font-size: 3.8rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
        }

        .win { color: #00ff88; text-shadow: 0 0 25px rgba(0, 255, 136, 0.6); }
        .lose { color: #ef4444; text-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        .draw { color: #ffc831; text-shadow: 0 0 25px rgba(255, 200, 49, 0.6); }

        .trophy-change-badge {
            font-size: 1.4rem;
            font-weight: 900;
            margin: 12px 0 5px 0;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .trophy-change-badge.gain { color: #00ff88; }
        .trophy-change-badge.loss { color: #ef4444; }
        .trophy-change-badge.draw { color: #ffc831; }

        .xp-change-badge {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        /* Rank Badge Display */
        .rank-badge-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .rank-icon { font-size: 2rem; }
        .rank-name { font-weight: 800; font-size: 1.1rem; color: #ffc831; }

        /* Trophy Progress Bar UI */
        .trophy-bar-section {
            width: 100%;
            margin-bottom: 25px;
        }

        .trophy-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a0aec0;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .trophy-progress-bg {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 200, 49, 0.3);
            position: relative;
        }

        .trophy-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9000, #ffc831);
            border-radius: 10px;
            transition: width 0.8s ease-out;
            box-shadow: 0 0 10px rgba(255, 200, 49, 0.6);
        }

        .btn-return {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ffc831, #ff9000);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 200, 49, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-return:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 200, 49, 0.7);
        }
    </style>
</head>
<body>

    <div class="battle-stage">
        <div class="grid-bg"></div>

        <!-- Top HUD -->
        <div class="top-hud">
            <!-- ฝ่ายผู้ท้าชน (ทีมผู้เล่น) -->
            <div class="player-info">
                <div style="font-weight: bold; color: #ffc831;" id="p1-name">Auto</div>
                <div style="font-size: 0.8rem; color: #a0aec0;">ฝ่ายผู้ท้าชน</div>
                <div class="team-hp-bar">
                    <div class="team-hp-fill player-hp-fill" id="p1-team-hp"></div>
                    <div class="shield-fill" id="p1-team-shield" style="width: 0%;"></div>
                </div>
                <!-- แท็กแสดงสถานะบัฟสปีด (อยู่ใต้หลอดเลือดของทีม) -->
                <div class="team-speed-buff-tag" id="p1-speed-status">⚡ SPEED BOOST (+20% Spd)</div>
            </div>

            <div class="center-hud-box">
                <div class="vs-badge">VS</div>
                <div class="timer-display" id="battle-timer">02:00</div>
            </div>

            <!-- ฝ่ายตั้งรับ (คู่ต่อสู้) -->
            <div class="enemy-info">
                <div style="font-weight: bold; color: #ef4444;" id="p2-name">test001</div>
                <div style="font-size: 0.8rem; color: #a0aec0;">ฝ่ายตั้งรับ</div>
                <div class="team-hp-bar">
                    <div class="team-hp-fill enemy-hp-fill" id="p2-team-hp"></div>
                    <div class="shield-fill" id="p2-team-shield" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- Field for 2D Cards -->
        <div class="field" id="battle-field"></div>

        <!-- Item Controller HUD -->
        <div class="item-hud" id="item-hud"></div>

        <!-- Overlay Countdown Screen -->
        <div class="overlay-screen" id="countdown-screen">
            <div class="countdown-text" id="countdown-num">กำลังโหลด...</div>
        </div>

        <!-- Match Result Modal -->
        <div class="result-panel" id="result-screen">
            <div class="result-card">
                <div class="result-title" id="result-title">VICTORY!</div>
                
                <div class="trophy-change-badge gain" id="trophy-change-text">🏆 +15 ถ้วยรางวัล</div>
                <div class="xp-change-badge" id="xp-change-text">✨ +200 XP Grand Pass</div>

                <div class="rank-badge-container">
                    <span class="rank-icon" id="rank-icon">🥉</span>
                    <span class="rank-name" id="rank-name">BRONZE 3</span>
                </div>

                <div class="trophy-bar-section">
                    <div class="trophy-label-row">
                        <span>ถ้วยรางวัลทั้งหมด</span>
                        <span id="trophy-count-text">0 / 100</span>
                    </div>
                    <div class="trophy-progress-bg">
                        <div class="trophy-progress-fill" id="trophy-bar-fill"></div>
                    </div>
                </div>

                <button class="btn-return" onclick="window.location.href='Grand Arena.html'">กลับสู่แกรนด์อารีน่า</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({ 
        apiKey: "AIzaSyCLgMyUiSZcIdBXnefK3SHQiVpSaBm8xoM", authDomain: "sign-up-73f99.firebaseapp.com", 
        projectId: "sign-up-73f99", storageBucket: "sign-up-73f99.appspot.com", 
        messagingSenderId: "916335559099", appId: "1:916335559099:web:3a8ed896ba26e38991849e" 
    }));
    const auth = getAuth();

    const urlParams = new URLSearchParams(window.location.search);
    const opponentId = urlParams.get('opponent') || 'BOT';
    const selectedItem = urlParams.get('item') || '';

    let myCards = [];
    let enemyCards = [];
    let currentUserUid = null;
    let currentTrophies = 0;
    let currentArenaXp = 0;
    const field = document.getElementById('battle-field');
    let battleActive = false;

    let battleTimeSeconds = 120;
    let timerInterval = null;

    const RANK_TIERS = [
        { name: "BRONZE 3", min: 0, icon: "🥉", color: "#cd7f32", win: 50, lose: 5 },
        { name: "BRONZE 2", min: 100, icon: "🥉", color: "#cd7f32", win: 50, lose: 8 },
        { name: "BRONZE 1", min: 300, icon: "🥉", color: "#cd7f32", win: 40, lose: 10 },
        { name: "SILVER 3", min: 600, icon: "🥈", color: "#c0c0c0", win: 45, lose: 15 },
        { name: "SILVER 2", min: 1000, icon: "🥈", color: "#c0c0c0", win: 50, lose: 18 },
        { name: "SILVER 1", min: 1400, icon: "🥈", color: "#c0c0c0", win: 55, lose: 20 },
        { name: "GOLD 3", min: 1800, icon: "🥇", color: "#ffd700", win: 60, lose: 25 },
        { name: "GOLD 2", min: 2200, icon: "🥇", color: "#ffd700", win: 65, lose: 30 },
        { name: "GOLD 1", min: 2600, icon: "🥇", color: "#ffd700", win: 70, lose: 35 },
        { name: "DIAMOND 4", min: 3100, icon: "💎", color: "#00eeee", win: 75, lose: 40 },
        { name: "DIAMOND 3", min: 3700, icon: "💎", color: "#00eeee", win: 80, lose: 45 },
        { name: "DIAMOND 2", min: 4400, icon: "💎", color: "#00eeee", win: 90, lose: 50 },
        { name: "DIAMOND 1", min: 5200, icon: "💎", color: "#00eeee", win: 95, lose: 55 },
        { name: "MASTER 4", min: 6100, icon: "⚔️", color: "#ff4500", win: 100, lose: 65 },
        { name: "MASTER 3", min: 7200, icon: "⚔️", color: "#ff4500", win: 100, lose: 70 },
        { name: "MASTER 2", min: 8500, icon: "⚔️", color: "#ff4500", win: 100, lose: 75 },
        { name: "MASTER 1", min: 10000, icon: "🔥", color: "#ff0000", win: 115, lose: 85 },
        { name: "Supreme MASTER 3", min: 15000, icon: "👑", color: "rainbow", win: 120, lose: 100 },
        { name: "Supreme MASTER 2", min: 17000, icon: "👑", color: "rainbow", win: 140, lose: 110 },
        { name: "Supreme MASTER 1", min: 19000, icon: "👑", color: "rainbow", win: 160, lose: 120 },
        { name: "Supreme MASTER PRO!!", min: 21000, icon: "👑🔥", color: "rainbow", win: 200, lose: 150 }
    ];

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            alert("กรุณาล็อกอินก่อนเข้าสู่สนามต่อสู้");
            window.location.href = "index.html";
            return;
        }

        currentUserUid = user.uid;

        try {
            const mySnap = await getDoc(doc(db, "users", user.uid));
            if (mySnap.exists()) {
                const myData = mySnap.data();
                document.getElementById('p1-name').innerText = myData.displayName || myData.username || "คุณ";
                currentTrophies = Number(myData.trophies || 0);
                currentArenaXp = Number(myData.arenaPassXp || 0);
                
                const rawMyCards = myData.defenseCards?.length ? myData.defenseCards : 
                                  (myData.showcaseCards?.length ? myData.showcaseCards : (myData.collection || []).slice(0, 3));

                myCards = formatCardsData(rawMyCards, 'my');
            }

            if (opponentId.startsWith('bot_')) {
                document.getElementById('p2-name').innerText = `BOT (${opponentId})`;
                enemyCards = generateBotCards();
            } else {
                const enemySnap = await getDoc(doc(db, "users", opponentId));
                if (enemySnap.exists()) {
                    const enemyData = enemySnap.data();
                    document.getElementById('p2-name').innerText = enemyData.displayName || enemyData.username || "คู่ต่อสู้";
                    
                    const rawEnemyCards = enemyData.defenseCards?.length ? enemyData.defenseCards : 
                                         (enemyData.showcaseCards?.length ? enemyData.showcaseCards : (enemyData.collection || []).slice(0, 3));

                    enemyCards = formatCardsData(rawEnemyCards, 'enemy');
                } else {
                    document.getElementById('p2-name').innerText = "BOT (สำรอง)";
                    enemyCards = generateBotCards();
                }
            }

            if (!myCards.length) myCards = generateBotCards('my');
            if (!enemyCards.length) enemyCards = generateBotCards('enemy');

            applyPassiveShield();
            setupItemUI();
            updateTeamHpHUD();
            startCountdown();

        } catch (e) {
            console.error("Error loading battle data:", e);
            document.getElementById('countdown-num').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
        }
    });

    function applyPassiveShield() {
        const itemLower = selectedItem.toLowerCase();
        if (itemLower.includes('shield') || itemLower.includes('โล่')) {
            myCards.forEach(c => {
                c.shield = 50;
                c.maxShield = 50;
            });
        }
    }

    function setupItemUI() {
        const itemHud = document.getElementById('item-hud');
        itemHud.innerHTML = '';

        const itemLower = selectedItem.toLowerCase();
        if (!selectedItem || itemLower.includes('shield') || itemLower.includes('โล่')) return;

        const btn = document.createElement('button');
        btn.className = 'item-btn';
        
        if (itemLower.includes('lightning') || itemLower.includes('สายฟ้า')) {
            btn.innerText = '⚡ สตันฝ่ายตรงข้าม (3 วิ)';
            btn.onclick = () => useLightningItem(btn);
        } else {
            // ปุ่มค่าเริ่มต้นสำหรับไอเทมเพิ่มสปีด/โจมตี
            btn.innerText = '🧪 ใช้ไอเทมบัฟทีม (+20% Speed)';
            btn.onclick = () => useSpeedPotionItem(btn);
        }

        itemHud.appendChild(btn);
    }

    function triggerSpeedBuffTag(durationMs = 20000) {
        const tag = document.getElementById('p1-speed-status');
        if (tag) {
            tag.style.display = 'inline-block';
            setTimeout(() => {
                tag.style.display = 'none';
            }, durationMs);
        }
    }

    function useLightningItem(btn) {
        if (!battleActive) return;
        const now = Date.now();
        enemyCards.forEach(c => {
            if (c.hp > 0) {
                c.stunnedUntil = now + 3000;
                showDamagePop(c.x + 30, c.y - 10, "⚡ STUNNED 3s!");
            }
        });
        btn.disabled = true;
        btn.innerText = '✨ ใช้แล้ว';
    }

    function useSpeedPotionItem(btn) {
        if (!battleActive) return;
        
        // เรียกแสดงป้ายเรืองแสงใต้หลอดเลือดผู้ท้าชนทันที
        triggerSpeedBuffTag(20000);

        myCards.forEach(c => {
            if (c.hp > 0) {
                const addedAtk = Math.round(c.atk * 0.3);
                c.atk += addedAtk;
                c.speed *= 1.20;

                const cardElem = document.getElementById(`card-${c.id}`);
                if (cardElem) cardElem.classList.add('speed-buffed');

                showDamagePop(c.x + 30, c.y - 10, "🔥 SPEED BOOST!");

                setTimeout(() => {
                    c.atk = Math.max(0, c.atk - addedAtk);
                    c.speed /= 1.20;

                    if (cardElem) cardElem.classList.remove('speed-buffed');
                }, 20000);
            }
        });
        btn.disabled = true;
        btn.innerText = '✨ ใช้แล้ว';
    }

    function formatCardsData(cardsList, prefix) {
        return cardsList.map((c, idx) => {
            const level = Number(c.level || c.lv || 1);
            const stars = Number(c.stars || c.star || 0);
            
            const baseHp = 200 + (level * 20) + (stars * 30);
            const baseAtk = 20 + (level * 5) + (stars * 8);

            return {
                id: `${prefix}_${idx}_${Date.now()}`,
                name: c.name || 'Unknown Card',
                level: level,
                hp: baseHp,
                maxHp: baseHp,
                shield: 0,
                maxShield: 0,
                atk: baseAtk,
                speed: 3 + (Math.random() * 1.5),
                stunnedUntil: 0,
                img: c.img || c.image || 'https://via.placeholder.com/150/ffc831/000?text=Card'
            };
        });
    }

    function generateBotCards(prefix = 'enemy') {
        const botImgs = [
            'https://via.placeholder.com/150/ffc831/000?text=Dragon',
            'https://via.placeholder.com/150/00ff88/000?text=Knight',
            'https://via.placeholder.com/150/ff4d4d/fff?text=Wizard'
        ];
        return [1, 2, 3].map((num, idx) => {
            const level = Math.floor(Math.random() * 5) + 1;
            const baseHp = 200 + (level * 20);
            return {
                id: `${prefix}_bot_${idx}_${Date.now()}`,
                name: `Bot Unit ${num}`,
                level: level,
                hp: baseHp,
                maxHp: baseHp,
                shield: 0,
                maxShield: 0,
                atk: 20 + (level * 4),
                speed: 3.2,
                stunnedUntil: 0,
                img: botImgs[idx % botImgs.length]
            };
        });
    }

    function spawnUnits() {
        const stageHeight = window.innerHeight;
        const stageWidth = window.innerWidth;

        myCards.forEach((c, idx) => {
            c.x = 100 + (idx * 30);
            c.y = (stageHeight / (myCards.length + 1)) * (idx + 1);
            c.isEnemy = false;
            createCardElem(c);
        });

        enemyCards.forEach((c, idx) => {
            c.x = stageWidth - 190 - (idx * 30);
            c.y = (stageHeight / (enemyCards.length + 1)) * (idx + 1);
            c.isEnemy = true;
            createCardElem(c);
        });
    }

    function createCardElem(c) {
        const div = document.createElement('div');
        div.id = `card-${c.id}`;
        div.className = `battle-unit ${c.isEnemy ? 'enemy' : ''}`;
        div.style.left = `${c.x}px`;
        div.style.top = `${c.y}px`;
        div.innerHTML = `
            <div class="unit-lv">Lv.${c.level}</div>
            <div class="hp-bar-container">
                <div class="hp-bar-fill" id="hp-${c.id}"></div>
                <div class="unit-shield-fill" id="shield-${c.id}" style="width: 0%;"></div>
            </div>
            <img src="${c.img}" alt="${c.name}">
        `;
        field.appendChild(div);
        
        if (c.shield > 0) {
            const shieldFill = div.querySelector(`#shield-${c.id}`);
            if (shieldFill) shieldFill.style.width = `${(c.shield / (c.maxHp + c.maxShield)) * 100}%`;
        }
    }

    function startCountdown() {
        spawnUnits();
        let count = 3;
        const numElem = document.getElementById('countdown-num');
        numElem.innerText = count;

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                numElem.innerText = count;
            } else if (count === 0) {
                numElem.style.fontSize = "3.5rem";
                numElem.innerText = "เริ่มการต่อสู้!";
            } else {
                clearInterval(timer);
                document.getElementById('countdown-screen').style.display = 'none';
                battleActive = true;
                startBattleTimer();
                requestAnimationFrame(gameLoop);
            }
        }, 1000);
    }

    function startBattleTimer() {
        const timerElem = document.getElementById('battle-timer');
        timerInterval = setInterval(() => {
            if (!battleActive) {
                clearInterval(timerInterval);
                return;
            }
            battleTimeSeconds--;
            
            const mins = String(Math.floor(battleTimeSeconds / 60)).padStart(2, '0');
            const secs = String(battleTimeSeconds % 60).padStart(2, '0');
            timerElem.innerText = `${mins}:${secs}`;

            if (battleTimeSeconds <= 0) {
                clearInterval(timerInterval);
                battleActive = false;

                const myTotalHp = myCards.reduce((acc, c) => acc + Math.max(0, c.hp) + Math.max(0, c.shield), 0);
                const enemyTotalHp = enemyCards.reduce((acc, c) => acc + Math.max(0, c.hp) + Math.max(0, c.shield), 0);

                setTimeout(() => {
                    if (myTotalHp > enemyTotalHp) {
                        showResult('win');
                    } else if (myTotalHp < enemyTotalHp) {
                        showResult('lose');
                    } else {
                        showResult('draw');
                    }
                }, 500);
            }
        }, 1000);
    }

    function updateTeamHpHUD() {
        const myTotalMaxHp = myCards.reduce((acc, c) => acc + c.maxHp, 0);
        const myTotalMaxShield = myCards.reduce((acc, c) => acc + c.maxShield, 0);
        const myTotalMax = myTotalMaxHp + myTotalMaxShield;

        const myCurrentHp = myCards.reduce((acc, c) => acc + Math.max(0, c.hp), 0);
        const myCurrentShield = myCards.reduce((acc, c) => acc + Math.max(0, c.shield), 0);

        const myHpPercent = myTotalMax > 0 ? (myCurrentHp / myTotalMax) * 100 : 0;
        const myShieldPercent = myTotalMax > 0 ? (myCurrentShield / myTotalMax) * 100 : 0;

        document.getElementById('p1-team-hp').style.width = `${myHpPercent}%`;
        document.getElementById('p1-team-shield').style.width = `${myShieldPercent}%`;

        const enemyTotalMaxHp = enemyCards.reduce((acc, c) => acc + c.maxHp, 0);
        const enemyTotalMaxShield = enemyCards.reduce((acc, c) => acc + c.maxShield, 0);
        const enemyTotalMax = enemyTotalMaxHp + enemyTotalMaxShield;

        const enemyCurrentHp = enemyCards.reduce((acc, c) => acc + Math.max(0, c.hp), 0);
        const enemyCurrentShield = enemyCards.reduce((acc, c) => acc + Math.max(0, c.shield), 0);

        const enemyHpPercent = enemyTotalMax > 0 ? (enemyCurrentHp / enemyTotalMax) * 100 : 0;
        const enemyShieldPercent = enemyTotalMax > 0 ? (enemyCurrentShield / enemyTotalMax) * 100 : 0;

        document.getElementById('p2-team-hp').style.width = `${enemyHpPercent}%`;
        document.getElementById('p2-team-shield').style.width = `${enemyShieldPercent}%`;
    }

    function gameLoop() {
        if (!battleActive) return;

        let aliveMine = myCards.filter(c => c.hp > 0 || c.shield > 0);
        let aliveEnemy = enemyCards.filter(c => c.hp > 0 || c.shield > 0);

        if (aliveMine.length === 0 || aliveEnemy.length === 0) {
            battleActive = false;
            if (timerInterval) clearInterval(timerInterval);
            
            setTimeout(() => {
                if (aliveMine.length > 0 && aliveEnemy.length === 0) {
                    showResult('win');
                } else if (aliveMine.length === 0 && aliveEnemy.length > 0) {
                    showResult('lose');
                } else {
                    showResult('draw');
                }
            }, 800);
            return;
        }

        aliveMine.forEach(unit => updateUnitBehavior(unit, aliveEnemy));
        aliveEnemy.forEach(unit => updateUnitBehavior(unit, aliveMine));

        requestAnimationFrame(gameLoop);
    }

    function updateUnitBehavior(unit, targets) {
        if (targets.length === 0) return;

        if (unit.stunnedUntil && Date.now() < unit.stunnedUntil) return;

        let target = targets[0];
        let minDist = 99999;

        targets.forEach(t => {
            let dist = Math.hypot(t.x - unit.x, t.y - unit.y);
            if (dist < minDist) {
                minDist = dist;
                target = t;
            }
        });

        if (minDist > 80) {
            let angle = Math.atan2(target.y - unit.y, target.x - unit.x);
            unit.x += Math.cos(angle) * unit.speed;
            unit.y += Math.sin(angle) * unit.speed;

            const elem = document.getElementById(`card-${unit.id}`);
            if (elem) {
                elem.style.left = `${unit.x}px`;
                elem.style.top = `${unit.y}px`;
            }
        } else {
            if (!unit.lastAttack || Date.now() - unit.lastAttack > 800) {
                unit.lastAttack = Date.now();
                attackTarget(unit, target);
            }
        }
    }

    function attackTarget(attacker, target) {
        const elem = document.getElementById(`card-${attacker.id}`);
        if(elem) {
            elem.style.transform = 'scale(1.15)';
            setTimeout(() => elem.style.transform = 'scale(1)', 150);
        }

        let dmg = attacker.atk + Math.floor(Math.random() * 8 - 4);
        let remainDmg = dmg;

        if (target.shield > 0) {
            if (target.shield >= remainDmg) {
                target.shield -= remainDmg;
                remainDmg = 0;
            } else {
                remainDmg -= target.shield;
                target.shield = 0;
            }
        }

        if (remainDmg > 0) {
            target.hp = Math.max(0, target.hp - remainDmg);
        }

        const hpFill = document.getElementById(`hp-${target.id}`);
        const shieldFill = document.getElementById(`shield-${target.id}`);
        const maxVal = target.maxHp + target.maxShield;

        if (hpFill) hpFill.style.width = `${(target.hp / maxVal) * 100}%`;
        if (shieldFill) shieldFill.style.width = `${(target.shield / maxVal) * 100}%`;

        updateTeamHpHUD();
        showDamagePop(target.x + 30, target.y - 10, dmg);

        if (target.hp <= 0 && target.shield <= 0) {
            const targetElem = document.getElementById(`card-${target.id}`);
            if (targetElem) {
                targetElem.style.opacity = '0';
                setTimeout(() => targetElem.remove(), 300);
            }
        }
    }

    function showDamagePop(x, y, text) {
        const pop = document.createElement('div');
        pop.className = 'damage-pop';
        pop.style.left = `${x}px`;
        pop.style.top = `${y}px`;
        pop.innerText = typeof text === 'number' ? `-${text}` : text;
        field.appendChild(pop);
        setTimeout(() => pop.remove(), 600);
    }

    function getRankConfig(trophies) {
        let currentTierIndex = 0;
        for (let i = 0; i < RANK_TIERS.length; i++) {
            if (trophies >= RANK_TIERS[i].min) {
                currentTierIndex = i;
            }
        }

        const current = RANK_TIERS[currentTierIndex];
        const next = RANK_TIERS[currentTierIndex + 1] || null;
        
        return {
            ...current,
            max: next ? next.min : current.min + 5000
        };
    }

    async function showResult(resultType) {
        const resPanel = document.getElementById('result-screen');
        const resTitle = document.getElementById('result-title');
        const changeText = document.getElementById('trophy-change-text');
        const xpChangeText = document.getElementById('xp-change-text');
        
        const currentRank = getRankConfig(currentTrophies);
        
        let trophyDelta = 0;
        let xpDelta = 0;

        if (resultType === 'win') {
            trophyDelta = currentRank.win;
            xpDelta = 200;
        } else if (resultType === 'lose') {
            trophyDelta = -currentRank.lose;
            xpDelta = 50;
        } else {
            trophyDelta = 0;
            xpDelta = 0;
        }

        let newTrophies = Math.max(0, currentTrophies + trophyDelta);
        let newArenaXp = currentArenaXp + xpDelta;
        const newRank = getRankConfig(newTrophies);

        resPanel.style.display = 'flex';

        if (resultType === 'win') {
            resTitle.innerText = "VICTORY!";
            resTitle.className = "result-title win";
            changeText.innerText = `🏆 +${currentRank.win} ถ้วยรางวัล`;
            changeText.className = "trophy-change-badge gain";
            xpChangeText.innerText = `✨ +${xpDelta} XP Grand Pass`;
        } else if (resultType === 'lose') {
            resTitle.innerText = "DEFEAT";
            resTitle.className = "result-title lose";
            changeText.innerText = `🏆 -${currentRank.lose} ถ้วยรางวัล`;
            changeText.className = "trophy-change-badge loss";
            xpChangeText.innerText = `✨ +${xpDelta} XP Grand Pass`;
        } else {
            resTitle.innerText = "DRAW";
            resTitle.className = "result-title draw";
            changeText.innerText = `🏆 0 ถ้วยรางวัล (เสมอกัน)`;
            changeText.className = "trophy-change-badge draw";
            xpChangeText.innerText = `✨ +0 XP Grand Pass (เสมอไม่ได้ XP)`;
        }

        document.getElementById('rank-icon').innerText = newRank.icon;
        const nameElem = document.getElementById('rank-name');
        nameElem.innerText = newRank.name;
        if (newRank.color !== "rainbow") {
            nameElem.style.color = newRank.color;
        } else {
            nameElem.style.color = "#ff4500";
        }

        const targetMax = newRank.max;
        const barPercent = Math.min(100, Math.max(0, (newTrophies / targetMax) * 100));

        document.getElementById('trophy-count-text').innerText = `${newTrophies} / ${targetMax}`;
        
        setTimeout(() => {
            document.getElementById('trophy-bar-fill').style.width = `${barPercent}%`;
        }, 100);

        if (currentUserUid) {
            try {
                const userRef = doc(db, "users", currentUserUid);
                await updateDoc(userRef, {
                    trophies: newTrophies,
                    arenaPassXp: newArenaXp
                });
            } catch (err) {
                console.error("อัปเดตถ้วยรางวัลและ XP ไม่สำเร็จ:", err);
            }
        }
    }
</script>
