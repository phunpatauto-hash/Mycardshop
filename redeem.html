<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDEEM CODE - My Card Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #ffc831;
            --gold-dark: #e5b32a;
            --gem-color: #00f0ff;
            --bg: #0a0a0c;
            --card-bg: rgba(26, 26, 32, 0.95);
            --input-bg: #050505;
        }
        
        * { box-sizing: border-box; }

        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at center, #1a1a24 0%, #050505 100%);
            color: white; 
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- 📱 แถบแสดงกระเป๋าเงินแบบหรูหรา (Real-time Navbar) --- */
        .navbar { 
            background: rgba(10, 10, 12, 0.85); 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid rgba(255, 200, 49, 0.2); 
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 80px;
            width: 100%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
        }

        .btn-nav { 
            background: rgba(255, 255, 255, 0.03); 
            color: #ccc; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 10px 20px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-size: 0.9rem; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        .btn-nav:hover { 
            background: var(--gold); 
            color: #000; 
            border-color: var(--gold); 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 200, 49, 0.3);
        }

        .nav-title {
            color: var(--gold); 
            font-weight: 700; 
            letter-spacing: 3px; 
            font-size: 1.3rem; 
            text-shadow: 0 0 15px rgba(255, 200, 49, 0.4);
            text-transform: uppercase;
        }

        .wallet-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .wallet-item {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .wallet-item.gold-wallet { border-color: rgba(255, 200, 49, 0.3); text-shadow: 0 0 10px rgba(255, 200, 49, 0.2); }
        .wallet-item.gem-wallet { border-color: rgba(0, 240, 255, 0.3); text-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }

        .wallet-item i { 
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px currentColor);
        }

        /* --- Main Content Layout --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-ticket {
            position: absolute;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Redeem Card Box --- */
        .box { 
            background: var(--card-bg); 
            padding: 60px 45px; 
            border-radius: 40px; 
            text-align: center; 
            border: 2px solid rgba(255, 200, 49, 0.25); 
            width: 90%;
            max-width: 460px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(255, 200, 49, 0.05);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
        }

        .box::before, .box::after {
            content: '';
            position: absolute;
            width: 44px; height: 44px;
            background: #0f0f14;
            border-radius: 50%;
            top: 50%; transform: translateY(-50%);
            border: 2px solid rgba(255, 200, 49, 0.25);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .box::before { left: -24px; }
        .box::after { right: -24px; }

        .icon-header {
            font-size: 5rem;
            color: var(--gold);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 200, 49, 0.6));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.04); }
        }

        h2 { 
            color: var(--gold); 
            margin: 0; 
            font-size: 2.4rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .desc { font-size: 1rem; color: #8a8a9e; margin-bottom: 40px; letter-spacing: 1px; }

        .input-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        input { 
            width: 100%; 
            padding: 20px; 
            border-radius: 20px; 
            border: 2px solid #2d2d38; 
            background: var(--input-bg); 
            color: var(--gold); 
            text-align: center; 
            font-size: 1.6rem; 
            font-weight: bold; 
            box-sizing: border-box; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 4px;
            text-transform: uppercase;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.6);
        }

        input:focus { 
            outline: none; 
            border-color: var(--gold); 
            box-shadow: 0 0 30px rgba(255, 200, 49, 0.25), inset 0 3px 10px rgba(0,0,0,0.8);
            transform: scale(1.02);
        }

        button { 
            width: 100%; 
            padding: 20px; 
            background: linear-gradient(135deg, #ffe066, var(--gold), #f39c12); 
            border: none; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 1.25rem; 
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(255, 200, 49, 0.25);
        }

        button:hover { 
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(255, 200, 49, 0.45);
            filter: brightness(1.1);
        }

        button:active { transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .back-link { 
            color: #5c5c70; 
            text-decoration: none; 
            margin-top: 35px; 
            display: inline-block; 
            font-size: 0.95rem; 
            transition: 0.3s;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .back-link:hover { color: var(--gold); text-shadow: 0 0 10px rgba(255,200,49,0.3); }

        .loader {
            width: 22px; height: 22px;
            border: 3px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 🌐 Top Real-time Navbar -->
    <nav class="navbar">
        <a href="index.html" class="btn-nav"><i class="fas fa-arrow-left"></i> BACK TO GACHA</a>
        <div class="nav-title">Redeem Center</div>
        
        <!-- ส่วนแสดงกระเป๋าเงิน ดึงค่าสดจากฐานข้อมูลจริง -->
        <div class="wallet-container">
            <div class="wallet-item gold-wallet" style="color: var(--gold);">
                <i class="fas fa-coins"></i> <span id="nav-points">LOADING...</span>
            </div>
            <div class="wallet-item gem-wallet" style="color: var(--gem-color);">
                <i class="fas fa-gem"></i> <span id="nav-diamonds">LOADING...</span>
            </div>
        </div> 
    </nav>

    <div class="main-content">
        <div class="bg-animate" id="bg-tickets"></div>

        <div class="box">
            <div class="icon-header">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <h2>REDEEM</h2>
            <p class="desc">กรอกรหัสของคุณเพื่อรับของรางวัลเข้าบัญชี</p>
            
            <div class="input-wrapper">
                <input type="text" id="code-input" placeholder="ENTER CODE" maxlength="20" autocomplete="off">
            </div>

            <button id="redeem-btn">
                <span class="loader" id="btn-loader"></span>
                <span id="btn-text">CLAIM REWARD</span>
            </button>

            <br>
            <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> BACK TO HOME</a>
        </div>
    </div>

<script type="module">
    // --- Background Floating Animation Effect ---
    const bgContainer = document.getElementById('bg-tickets');
    const ticketIcons = [
        { icon: 'fa-ticket-alt', color: 'rgba(255, 200, 49, 0.1)' },
        { icon: 'fa-star', color: 'rgba(255, 200, 49, 0.08)' },
        { icon: 'fa-gem', color: 'rgba(0, 240, 255, 0.08)' },
        { icon: 'fa-coins', color: 'rgba(255, 200, 49, 0.12)' }
    ];

    function createFloatingIcon() {
        const icon = document.createElement('i');
        const chosen = ticketIcons[Math.floor(Math.random() * ticketIcons.length)];
        
        icon.className = `fas ${chosen.icon} floating-ticket`;
        icon.style.color = chosen.color;
        icon.style.left = Math.random() * 100 + 'vw';
        icon.style.animationDuration = (Math.random() * 4 + 6) + 's';
        icon.style.fontSize = (Math.random() * 18 + 22) + 'px';
        
        bgContainer.appendChild(icon);
        setTimeout(() => { icon.remove(); }, 10000);
    }
    setInterval(createFloatingIcon, 500);

    // --- Firebase Service Integration ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCLgMyUiSZcIdBXnefK3SHQiVpSaBm8xoM",
        authDomain: "sign-up-73f99.firebaseapp.com",
        projectId: "sign-up-73f99",
        storageBucket: "sign-up-73f99.appspot.com",
        messagingSenderId: "916335559099",
        appId: "1:916335559099:web:3a8ed896ba26e38991849e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let unsubscribeUser = null;

    // ติดตามสถานะผู้ใช้และอัปเดตยอดเงินในกระเป๋าแบบ Real-time ตลอดเวลา
    onAuthStateChanged(auth, (user) => {
        const pointsElement = document.getElementById("nav-points");
        const diamondsElement = document.getElementById("nav-diamonds");

        if (user) {
            currentUserId = user.uid;
            
            // ใช้ onSnapshot เพื่อดึงค่าจริงจากเซิร์ฟเวอร์แบบ Real-time ทันทีที่เข้าหน้านี้
            unsubscribeUser = onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const userData = snap.data();
                    // ตรวจสอบทั้งเคสสะกด 'points' และ 'point' เพื่อความชัวร์ไม่ให้บั๊ก
                    const currentGold = userData.points !== undefined ? userData.points : (userData.point || 0);
                    const currentDiamonds = userData.diamonds || 0;
                    
                    // แสดงผลลัพธ์ด้วยฟอร์แมตใส่คอมมาคั่นสวยๆ (.toLocaleString)
                    pointsElement.innerText = currentGold.toLocaleString();
                    diamondsElement.innerText = currentDiamonds.toLocaleString();
                } else {
                    pointsElement.innerText = "0";
                    diamondsElement.innerText = "0";
                }
            }, (error) => {
                console.error("Error fetching user data:", error);
                pointsElement.innerText = "ERROR";
                diamondsElement.innerText = "ERROR";
            });
        } else {
            currentUserId = null;
            if (unsubscribeUser) unsubscribeUser();
            pointsElement.innerText = "UNAUTH";
            diamondsElement.innerText = "UNAUTH";
            alert("🔒 ไม่พบเซสชันการเข้าสู่ระบบ กรุณากลับไปลงชื่อเข้าใช้ที่หน้าหลักก่อนนะครับ");
        }
    });

    // --- ฟังก์ชันการตรวจสอบแลก Code ---
    document.getElementById("redeem-btn").onclick = async () => {
        const btn = document.getElementById("redeem-btn");
        const btnText = document.getElementById("btn-text");
        const btnLoader = document.getElementById("btn-loader");
        const inputCode = document.getElementById("code-input").value.trim().toUpperCase();

        if (!currentUserId) return alert("❌ กรุณาล็อกอินเข้าสู่ระบบก่อนแลกโค้ดนะครับ!");
        if (!inputCode) return alert("❌ กรุณากรอกรหัสโค้ดในช่องว่างก่อนกดแลกครับ!");

        btn.disabled = true;
        btnText.innerText = "CHECKING...";
        btnLoader.style.display = "inline-block";

        try {
            const codeRef = doc(db, "codes", inputCode);
            const codeSnap = await getDoc(codeRef);

            if (!codeSnap.exists()) throw new Error("ไม่พบรหัสโค้ดนี้ในระบบ หรือโค้ดอาจหมดอายุไปแล้ว");

            const codeData = codeSnap.data();
            
            // ตรวจสอบจำนวนการใช้สิทธิ์สูงสุด (Max Use)
            if (codeData.maxUse > 0 && codeData.usedCount >= codeData.maxUse) {
                throw new Error("ขออภัย โค้ดรางวัลชิ้นนี้ถูกใช้งานครบกำหนดสิทธิ์แล้ว");
            }

            // ตรวจสอบประวัติการเคลมโค้ดซ้ำของผู้ใช้รายนี้
            const historyRef = doc(db, "users", currentUserId, "used_codes", inputCode);
            const historySnap = await getDoc(historyRef);
            if (historySnap.exists()) throw new Error("คุณเคยแลกรับของรางวัลจากรหัสโค้ดนี้ไปแล้ว!");

            const userRef = doc(db, "users", currentUserId);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) throw new Error("ไม่พบฐานข้อมูลบัญชีผู้เล่นของคุณ");
            
            const userData = userSnap.data();
            let currentCollection = userData.collection || [];
            let updatedCollection = [...currentCollection];
            let cardInfo = "";

            // จัดการกรณีรางวัลระบุเป็นไอเทมการ์ดลงคลังสะสม
            if (codeData.rewardCard && codeData.rewardCard.name) {
                const rewardAmount = Number(codeData.rewardCard.count) || 1;
                const newCardEntry = {
                    name: codeData.rewardCard.name,
                    rarity: (codeData.rewardCard.rarity || "C").toUpperCase(),
                    img: codeData.rewardCard.img || codeData.rewardCard.image || "", 
                    level: 1,
                    stars: 0,
                    obtainedDate: new Date().toLocaleDateString('th-TH'),
                    type: "Gift"
                };

                for (let i = 0; i < rewardAmount; i++) {
                    updatedCollection.push({ ...newCardEntry });
                }
                cardInfo = `\n🎴 การ์ดรางวัล: ${codeData.rewardCard.name} (x${rewardAmount})`;
            }

            // จ่ายเงิน อัปเดตทอง อัปเดตเพชร และคลังการ์ดพร้อมกัน
            await updateDoc(userRef, {
                points: increment(codeData.rewardPoints || 0),
                diamonds: increment(codeData.rewardDiamonds || 0),
                collection: updatedCollection 
            });

            // เพิ่มจำนวนการใช้งานบนสถิติโค้ดกลาง และลงบันทึกประวัติส่วนตัวกันเหนียว
            await updateDoc(codeRef, { usedCount: increment(1) });
            await setDoc(historyRef, { redeemedAt: new Date().toISOString(), code: inputCode });

            alert(`🎉 ยินดีด้วย แลกโค้ดสำเร็จแล้ว!\n🪙 ได้รับ Gold: +${(codeData.rewardPoints || 0).toLocaleString()}\n💎 ได้รับ Diamonds: +${(codeData.rewardDiamonds || 0).toLocaleString()}${cardInfo}`);
            
            // รีเซ็ตค่าและคืนสถานะ UI เพื่อให้พิมพ์โค้ดใหม่ต่อได้ทันที
            document.getElementById("code-input").value = "";
            btn.disabled = false;
            btnText.innerText = "CLAIM REWARD";
            btnLoader.style.display = "none";

        } catch (e) {
            alert("❌ ปฏิเสธการแลกโค้ด: " + e.message);
            btn.disabled = false;
            btnText.innerText = "CLAIM REWARD";
            btnLoader.style.display = "none";
        }
    };
</script>
</body>
</html>
