<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDEEM CODE - My Card Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #ffc831;
            --gold-dark: #e5b32a;
            --gem-color: #60efff;
            --bg: #0a0a0c;
            --card-bg: rgba(26, 26, 32, 0.9);
            --input-bg: #050505;
        }
        
        * { box-sizing: border-box; }

        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at center, #16161a 0%, #050505 100%);
            color: white; 
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- 📱 แถบแสดงกระเป๋าเงินแบบ Real-time ด้านบนสุด --- */
        .navbar { 
            background: rgba(15, 15, 15, 0.85); 
            padding: 0 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,200,49,0.2); 
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 70px;
            width: 100%;
        }
        .btn-nav { 
            background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            padding: 8px 18px; border-radius: 50px; text-decoration: none; 
            font-size: 0.85rem; transition: 0.3s; 
            display: flex; align-items: center; gap: 8px;
        }
        .btn-nav:hover { background: var(--gold); color: #000; border-color: var(--gold); transform: scale(1.05); }

        .wallet-container {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .wallet-item {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wallet-item i { font-size: 1.1rem; }

        /* --- Main Content Wrapper --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* --- Background Animation: Floating Items --- */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-ticket {
            position: absolute;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        /* --- Redeem Card Box --- */
        .box { 
            background: var(--card-bg); 
            padding: 50px 40px; 
            border-radius: 40px; 
            text-align: center; 
            border: 2px solid rgba(255, 200, 49, 0.3); 
            width: 90%;
            max-width: 450px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(255, 200, 49, 0.1);
            backdrop-filter: blur(15px);
            position: relative;
            z-index: 10;
        }

        /* ตกแต่งกล่องให้ดูเหมือนตั๋ว (รอยบากด้านข้าง) */
        .box::before, .box::after {
            content: '';
            position: absolute;
            width: 40px; height: 40px;
            background: var(--bg);
            border-radius: 50%;
            top: 50%; transform: translateY(-50%);
            border: 2px solid rgba(255, 200, 49, 0.3);
        }
        .box::before { left: -22px; }
        .box::after { right: -22px; }

        .icon-header {
            font-size: 4.5rem;
            color: var(--gold);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(255, 200, 49, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }

        h2 { 
            color: var(--gold); 
            margin: 0; 
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .desc { font-size: 1rem; color: #888; margin-bottom: 35px; letter-spacing: 1px; }

        .input-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        input { 
            width: 100%; 
            padding: 18px; 
            border-radius: 20px; 
            border: 2px solid #333; 
            background: var(--input-bg); 
            color: var(--gold); 
            text-align: center; 
            font-size: 1.5rem; 
            font-weight: bold; 
            box-sizing: border-box; 
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        input:focus { 
            outline: none; 
            border-color: var(--gold); 
            box-shadow: 0 0 30px rgba(255, 200, 49, 0.2);
            transform: scale(1.02);
        }

        button { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(135deg, var(--gold), #f39c12); 
            border: none; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 1.2rem; 
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 20px rgba(255, 200, 49, 0.2);
        }

        button:hover { 
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 200, 49, 0.4);
            filter: brightness(1.1);
        }

        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-link { 
            color: #666; 
            text-decoration: none; 
            margin-top: 30px; 
            display: inline-block; 
            font-size: 0.95rem; 
            transition: 0.3s;
            font-weight: 300;
        }
        .back-link:hover { color: var(--gold); }

        .loader {
            width: 22px; height: 22px;
            border: 3px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: none;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- แถบด้านบนแสดงคะแนนคงเหลือ -->
    <nav class="navbar">
        <a href="index.html" class="btn-nav"><i class="fas fa-arrow-left"></i> หน้าหลักสุ่มการ์ด</a>
        <div style="color: var(--gold); font-weight: 800; letter-spacing: 4px; font-size: 1.2rem; text-shadow: 0 0 20px rgba(255,200,49,0.3);">REDEEM CENTER</div>
        
        <!-- ส่วนแสดงผลเงินคงเหลือแยกประเภทอย่างชัดเจน -->
        <div class="wallet-container">
            <div class="wallet-item" style="color: var(--gold);">
                <i class="fas fa-coins"></i> 🪙 <span id="nav-points">0</span>
            </div>
            <div class="wallet-item" style="color: var(--gem-color);">
                <i class="fas fa-gem"></i> 💎 <span id="nav-diamonds">0</span>
            </div>
        </div> 
    </nav>

    <div class="main-content">
        <div class="bg-animate" id="bg-tickets"></div>

        <div class="box">
            <div class="icon-header">
                <i class="fas fa-ticket-alt"></i>
            </div>
            <h2>REDEEM</h2>
            <p class="desc">กรอกรหัสของคุณเพื่อรับของรางวัล</p>
            
            <div class="input-wrapper">
                <input type="text" id="code-input" placeholder="ENTER CODE" maxlength="20" autocomplete="off">
            </div>

            <button id="redeem-btn">
                <span class="loader" id="btn-loader"></span>
                <span id="btn-text">CLAIM REWARD</span>
            </button>

            <br>
            <a href="index.html" class="back-link"><i class="fas fa-chevron-left"></i> BACK TO GACHA</a>
        </div>
    </div>

<script type="module">
    // --- สคริปต์สร้างเอฟเฟกต์ไอคอนลอยเบื้องหลัง (พาสเทลและไอเทมเกม) ---
    const bgContainer = document.getElementById('bg-tickets');
    // อัปเดตไอคอนให้ตรงตามของรางวัลที่มีในตู้และการสุ่ม
    const ticketIcons = [
        { icon: 'fa-ticket-alt', color: 'rgba(255, 200, 49, 0.12)' },
        { icon: 'fa-star', color: 'rgba(255, 200, 49, 0.12)' },
        { icon: 'fa-gem', color: 'rgba(96, 239, 255, 0.12)' },
        { icon: 'fa-coins', color: 'rgba(255, 200, 49, 0.15)' }
    ];

    function createFloatingIcon() {
        const icon = document.createElement('i');
        const chosen = ticketIcons[Math.floor(Math.random() * ticketIcons.length)];
        
        icon.className = `fas ${chosen.icon} floating-ticket`;
        icon.style.color = chosen.color;
        icon.style.left = Math.random() * 100 + 'vw';
        icon.style.animationDuration = (Math.random() * 4 + 6) + 's'; // ปรับความเร็ว 6-10 วินาทีให้ดูนุ่มนวล
        icon.style.fontSize = (Math.random() * 20 + 22) + 'px';
        
        bgContainer.appendChild(icon);
        setTimeout(() => { icon.remove(); }, 10000);
    }

    setInterval(createFloatingIcon, 450);

    // --- ระบบเชื่อมต่อข้อมูล Firebase และอัปเดตกระเป๋าเงิน Real-time ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCLgMyUiSZcIdBXnefK3SHQiVpSaBm8xoM",
        authDomain: "sign-up-73f99.firebaseapp.com",
        projectId: "sign-up-73f99",
        storageBucket: "sign-up-73f99.appspot.com",
        messagingSenderId: "916335559099",
        appId: "1:916335559099:web:3a8ed896ba26e38991849e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserId = null;
    let userCurrentPoints = 0;
    let userCurrentDiamonds = 0;

    // ตรวจสอบสถานะการล็อกอินและซิงค์ข้อมูลผู้ใช้แบบ Real-time[cite: 9]
    onAuthStateChanged(auth, (user) => {
        const pointsElement = document.getElementById("nav-points");
        const diamondsElement = document.getElementById("nav-diamonds");

        if (user) {
            currentUserId = user.uid;
            // ดึงค่ากระเป๋าเงินมาแสดงผลแบบ Real-time บน Navbar[cite: 9]
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const userData = snap.data();
                    userCurrentPoints = userData.points || userData.point || 0;[cite: 9]
                    userCurrentDiamonds = userData.diamonds || 0;[cite: 9]
                    
                    pointsElement.innerText = userCurrentPoints.toLocaleString();[cite: 9]
                    diamondsElement.innerText = userCurrentDiamonds.toLocaleString();[cite: 9]
                } else {
                    pointsElement.innerText = "0";
                    diamondsElement.innerText = "0";
                }
            });
        } else {
            pointsElement.innerText = "Guest";
            diamondsElement.innerText = "Guest";
        }
    });

    // --- ฟังก์ชันการตรวจสอบแลก Code ---
    document.getElementById("redeem-btn").onclick = async () => {
        const btn = document.getElementById("redeem-btn");
        const btnText = document.getElementById("btn-text");
        const btnLoader = document.getElementById("btn-loader");
        const inputCode = document.getElementById("code-input").value.trim().toUpperCase();

        if (!currentUserId) return alert("❌ กรุณาล็อกอินเข้าสู่ระบบก่อนแลกโค้ดนะครับ!");
        if (!inputCode) return alert("❌ กรุณากรอกโค้ดก่อนกดปุ่มยืนยันครับ!");

        btn.disabled = true;
        btnText.innerText = "CHECKING...";
        btnLoader.style.display = "inline-block";

        try {
            const codeRef = doc(db, "codes", inputCode);
            const codeSnap = await getDoc(codeRef);

            if (!codeSnap.exists()) throw new Error("ไม่พบโค้ดนี้ หรือรหัสโค้ดอาจหมดอายุไปแล้ว");

            const codeData = codeSnap.data();
            
            // เช็คโค้ดจำกัดจำนวนการใช้งาน
            if (codeData.maxUse > 0 && codeData.usedCount >= codeData.maxUse) {
                throw new Error("ขออภัย โค้ดรางวัลนี้ถูกใช้งานเต็มสิทธิ์จำนวนแล้ว");
            }

            // เช็คประวัติว่าเคยแลกไปหรือยัง
            const historyRef = doc(db, "users", currentUserId, "used_codes", inputCode);
            const historySnap = await getDoc(historyRef);
            if (historySnap.exists()) throw new Error("คุณเคยแลกรับของรางวัลจากโค้ดนี้ไปแล้ว!");

            const userRef = doc(db, "users", currentUserId);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) throw new Error("ไม่พบข้อมูลบัญชีผู้ใช้งานในระบบ");
            
            const userData = userSnap.data();
            let currentCollection = userData.collection || [];
            let updatedCollection = [...currentCollection];
            let cardInfo = "";

            // ตรวจสอบรางวัลประเภทการ์ดลงคลังสะสม
            if (codeData.rewardCard && codeData.rewardCard.name) {
                const rewardAmount = Number(codeData.rewardCard.count) || 1;
                const newCardEntry = {
                    name: codeData.rewardCard.name,
                    rarity: (codeData.rewardCard.rarity || "C").toUpperCase(),
                    img: codeData.rewardCard.img || codeData.rewardCard.image || "", 
                    level: 1,
                    stars: 0,
                    obtainedDate: new Date().toLocaleDateString('th-TH'),
                    type: "Gift"
                };

                for (let i = 0; i < rewardAmount; i++) {
                    updatedCollection.push({ ...newCardEntry });
                }
                cardInfo = `\n🎴 การ์ดรางวัล: ${codeData.rewardCard.name} (x${rewardAmount})`;
            }

            // ทำการอัปเดตยอด points, เพิ่มเติม diamonds ลงฐานข้อมูลพร้อมคลังการ์ด[cite: 9]
            await updateDoc(userRef, {
                points: increment(codeData.rewardPoints || 0),
                diamonds: increment(codeData.rewardDiamonds || 0), // อัปเดตเพชรเพิ่มเข้าไปอย่างถูกต้องตามหน้าสุ่ม[cite: 9]
                collection: updatedCollection 
            });

            // บันทึกสถิติฝั่ง Code และประวัติผู้ใช้งานเพื่อป้องกันสแปม
            await updateDoc(codeRef, { usedCount: increment(1) });
            await setDoc(historyRef, { redeemedAt: new Date().toISOString(), code: inputCode });

            alert(`🎉 แลกรับโค้ดของรางวัลสำเร็จแล้ว!\n🪙ได้รับ Gold: +${codeData.rewardPoints || 0}\n💎ได้รับ Diamonds: +${codeData.rewardDiamonds || 0}${cardInfo}`);
            
            // เคลียร์กล่องข้อความและคืนสถานะปุ่ม
            document.getElementById("code-input").value = "";
            btn.disabled = false;
            btnText.innerText = "CLAIM REWARD";
            btnLoader.style.display = "none";

        } catch (e) {
            alert("❌เกิดข้อผิดพลาด: " + e.message);
            btn.disabled = false;
            btnText.innerText = "CLAIM REWARD";
            btnLoader.style.display = "none";
        }
    };
</script>
</body>
</html>
