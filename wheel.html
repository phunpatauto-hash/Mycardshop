<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>วงล้อนำโชค - ฮาโลวีนอารีน่า</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK & Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLgMyUiSZcIdBXnefK3SHQiVpSaBm8xoM",
            authDomain: "sign-up-73f99.firebaseapp.com",
            projectId: "sign-up-73f99",
            storageBucket: "sign-up-73f99.appspot.com",
            messagingSenderId: "916335559099",
            appId: "1:916335559099:web:3a8ed896ba26e38991849e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let currentUsername = "ผู้เล่นเกม";

        function formatCompactNumber(number) {
            if (!number || isNaN(number)) return "0";
            const num = Number(number);
            if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        const userData = userDocSnap.data();
                        currentUsername = userData.username || "ผู้เล่นเกม";
                        document.getElementById("profile-name").innerText = currentUsername;
                        const userHalloweenCoins = userData.halloween_coins ?? userData.halloweenCoins ?? userData.halloweenCoin ?? userData.coins ?? 0;
                        document.getElementById("user-halloween-coins").innerText = formatCompactNumber(userHalloweenCoins);

                        if (userData.userPhoto) {
                            document.getElementById("profile-avatar-container").innerHTML = `<img src="${userData.userPhoto}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                        }
                    } else {
                        document.getElementById("profile-name").innerText = user.email || "ผู้ใช้งานระบบ";
                        document.getElementById("user-halloween-coins").innerText = "0";
                    }
                } catch (error) {
                    console.error("Error loading user profile:", error);
                }
            } else {
                alert("⚠️ กรุณาเข้าสู่ระบบก่อนใช้งานวงล้อนำโชค");
                window.location.href = "login.html";
            }
        });

        window.logWinnerToFeed = async function(prizeText) {
            if (!currentUserId) return;
            try {
                await addDoc(collection(db, "wheel_winners"), {
                    username: currentUsername,
                    prize: prizeText,
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("Error adding winner log: ", e);
            }
        }

        window.addCoinsToFirestore = async function(amount) {
            if (!currentUserId) return;
            try {
                const userRef = doc(db, "users", currentUserId);
                await updateDoc(userRef, {
                    halloween_coins: increment(amount)
                });
                const userDocSnap = await getDoc(userRef);
                if(userDocSnap.exists()) {
                    const updatedCoins = userDocSnap.data().halloween_coins ?? 0;
                    document.getElementById("user-halloween-coins").innerText = formatCompactNumber(updatedCoins);
                }
            } catch (e) {
                console.error("Error updating coins: ", e);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const winnersFeed = document.getElementById("winnersFeed");
            const q = query(collection(db, "wheel_winners"), orderBy("timestamp", "desc"), limit(15));
            
            onSnapshot(q, (snapshot) => {
                winnersFeed.innerHTML = "";
                if (snapshot.empty) {
                    winnersFeed.innerHTML = `<div style="text-align: center; color: #777; padding: 10px;">ยังไม่มีประวัติการได้รับรางวัล หมุนเป็นคนแรกเลย!</div>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = document.createElement("div");
                    item.className = "feed-item";
                    item.innerHTML = `
                        <span><i class="fas fa-trophy" style="color: #ffeb3b;"></i> <b>${data.username || 'ผู้เล่น'}</b> คว้าชัยรับรางวัล <span style="color: #ff9f43;">${data.prize}</span>!</span>
                    `;
                    winnersFeed.appendChild(item);
                });
            });
        });
    </script>

    <style>
        :root {
            --bg-dark: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background-image: radial-gradient(circle at 50% 50%, #2b2b48 0%, #1a1a2e 100%);
            padding: 15px;
            overflow-x: hidden;
        }

        .profile-bar {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .profile-info { display: flex; align-items: center; gap: 10px; }
        .profile-avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #4ecdc4, #556270);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: #fff; overflow: hidden;
        }
        .profile-details h4 { margin: 0; font-size: 1rem; color: #fff; }

        .coin-display {
            display: flex; align-items: center; gap: 6px; font-size: 0.9rem;
            background: rgba(255, 107, 0, 0.1);
            border: 1px solid rgba(255, 107, 0, 0.3);
            padding: 5px 12px; border-radius: 20px;
        }
        .halloween-coin-text { color: #ff6b00; font-weight: bold; text-shadow: 0 0 5px rgba(255, 107, 0, 0.6); }

        .btn-back-event {
            background: linear-gradient(135deg, #ff7b00, #ff4500);
            color: #fff; border: none; padding: 6px 14px; border-radius: 50px;
            font-size: 0.85rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 6px; text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4); font-family: 'Kanit', sans-serif;
        }

        .zoom-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: center center;
            transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .hub-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 { margin-top: 0; color: #ffeb3b; font-size: 1.6rem; text-shadow: 0 0 15px rgba(255,235,59,0.4); margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 0.85rem; margin-bottom: 10px; }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 15px auto;
        }

        @media (min-width: 480px) {
            .wheel-container { width: 340px; height: 340px; }
            h1 { font-size: 1.8rem; }
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #ffeb3b;
            z-index: 20;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
            border: 6px solid #ff9f43;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        canvas#wheelCanvas.rainbow-mode {
            border-color: transparent;
            animation: rainbowBorder 1.5s infinite linear;
        }
        @keyframes rainbowBorder {
            0% { box-shadow: 0 0 40px #ff0000, inset 0 0 20px #ff0000; }
            33% { box-shadow: 0 0 40px #00ff00, inset 0 0 20px #00ff00; }
            66% { box-shadow: 0 0 40px #0000ff, inset 0 0 20px #0000ff; }
            100% { box-shadow: 0 0 40px #ff0000, inset 0 0 20px #ff0000; }
        }

        .spin-btn {
            background: linear-gradient(135deg, #ffc831, #ff9000);
            border: none; color: #000; padding: 10px 35px;
            font-size: 1.1rem; font-weight: bold; border-radius: 50px;
            cursor: pointer; box-shadow: 0 5px 20px rgba(255,144,0,0.5);
            font-family: 'Kanit', sans-serif; margin-top: 10px;
        }
        .spin-btn:hover:not(:disabled) { transform: scale(1.05); }
        .spin-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; box-shadow: none; }

        .spin-counter {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #ff9f43;
            font-weight: bold;
        }

        .winners-chat-box {
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-top: 20px;
            padding: 15px;
            text-align: left;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }

        .chat-header {
            font-size: 0.95rem;
            color: #ffeb3b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .feed-container {
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .feed-container::-webkit-scrollbar {
            width: 4px;
        }
        .feed-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .feed-item {
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid #ff9f43;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: #ddd;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="profile-bar">
        <div class="profile-info">
            <div class="profile-avatar" id="profile-avatar-container"><i class="fas fa-user"></i></div>
            <div class="profile-details">
                <h4 id="profile-name">กำลังโหลดข้อมูลบัญชี...</h4>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <div class="coin-display">
                <span class="halloween-coin-text">🎃 <span id="user-halloween-coins">0</span> HALLOWEEN Coin</span>
            </div>
            <a href="halloween_event.html" class="btn-back-event">
                <i class="fas fa-arrow-left"></i> หน้าอีเว้นท์
            </a>
        </div>
    </div>

    <div class="zoom-wrapper" id="zoomWrapper">
        <div class="hub-container">
            <h1>🎡 วงล้อนำโชคฮาโลวีน 🎃</h1>
            <p class="subtitle">หมุนวงล้อแจกหนักจัดเต็ม ทุกช่องรางวัลมูลค่ามหาศาล!</p>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="400" height="400"></canvas>
            </div>

            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">หมุนวงล้อเลย!</button>
            <div class="spin-counter" id="spinCounterText">เหลือสิทธิ์หมุนอีก: 3 / 3 ครั้ง</div>
        </div>
    </div>

    <div class="winners-chat-box">
        <div class="chat-header">
            <i class="fas fa-bullhorn"></i> <b>ประกาศผู้โชคดีล่าสุด (Real-time Feed)</b>
        </div>
        <div class="feed-container" id="winnersFeed">
            <div style="text-align: center; color: #777; padding: 10px;">กำลังโหลดข้อมูลผู้โชคดี...</div>
        </div>
    </div>

    <script>
        const sectors = [
            { label: "1M Coin", value: 1000000, color: "#e74c3c", type: "normal" },
            { label: "5M Coin", value: 5000000, color: "#d35400", type: "normal" },
            { label: "10M Coin", value: 10000000, color: "#e67e22", type: "normal" },
            { label: "2M Coin", value: 2000000, color: "#e74c3c", type: "normal" },
            { label: "50M Coin", value: 50000000, color: "#f1c40f", type: "normal" },
            { label: "100M Coin", value: 100000000, color: "#2ecc71", type: "normal" },
            { label: "10M Coin", value: 10000000, color: "#e67e22", type: "normal" },
            { label: "3M Coin", value: 3000000, color: "#e74c3c", type: "normal" },
            { label: "1B Coin", value: 1000000000, color: "#3498db", type: "normal" },
            { label: "20M Coin", value: 20000000, color: "#e67e22", type: "normal" },
            { label: "🎁 รางวัลลับ", value: "secret", color: "#9b59b6", type: "secret" },
            { label: "5M Coin", value: 5000000, color: "#d35400", type: "normal" },
            { label: "25M Coin", value: 25000000, color: "#e67e22", type: "normal" },
            { label: "👑 10B (แจ็คพอต)", value: 10000000000, color: "#ff007f", type: "jackpot" },
            { label: "5M Coin", value: 5000000, color: "#d35400", type: "normal" },
            { label: "10M Coin", value: 10000000, color: "#d35400", type:"normal" }
        ];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const totalSectors = sectors.length;
        const arcSize = (2 * Math.PI) / totalSectors;
        let currentAngle = 0;
        let isSpinning = false;

        let spinCount = 0;
        const maxSpins = 3;

        function drawWheel() {
            const center = canvas.width / 2;
            const radius = canvas.width / 2 - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < totalSectors; i++) {
                const angle = i * arcSize;
                
                ctx.beginPath();
                ctx.fillStyle = sectors[i].color;
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, angle, angle + arcSize, false);
                ctx.lineTo(center, center);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px 'Kanit', sans-serif";
                ctx.fillText(sectors[i].label, radius - 15, 5);
                ctx.restore();
            }
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning || spinCount >= maxSpins) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;

            spinCount++;
            document.getElementById("spinCounterText").innerText = `เหลือสิทธิ์หมุนอีก: ${maxSpins - spinCount} / ${maxSpins} ครั้ง`;

            const winningIndex = Math.floor(Math.random() * totalSectors);
            const degreesPerSector = 360 / totalSectors;
            const targetSectorCenterAngle = (winningIndex * degreesPerSector) + (degreesPerSector / 2);
            
            const extraSpins = 360 * 5;
            const normalizedCurrentAngle = currentAngle % 360;
            const targetRotation = extraSpins + (360 - targetSectorCenterAngle) - normalizedCurrentAngle;
            
            currentAngle += targetRotation;
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            const selectedSector = sectors[winningIndex];
            const isJackpotOrSecret = (selectedSector.type === "jackpot" || selectedSector.type === "secret");

            if (isJackpotOrSecret) {
                setTimeout(() => {
                    const zoomWrapper = document.getElementById("zoomWrapper");
                    zoomWrapper.style.transform = "scale(1.3)";
                }, 2500);
            }

            setTimeout(() => {
                isSpinning = false;
                
                if (spinCount >= maxSpins) {
                    document.getElementById("spinBtn").disabled = true;
                    document.getElementById("spinBtn").innerText = "หมดสิทธิ์หมุนแล้ว";
                } else {
                    document.getElementById("spinBtn").disabled = false;
                }

                const zoomWrapper = document.getElementById("zoomWrapper");
                zoomWrapper.style.transform = "scale(1)";

                handleReward(selectedSector);
            }, 4000);
        }

        async function handleReward(sector) {
            if (window.logWinnerToFeed) {
                await window.logWinnerToFeed(sector.label);
            }

            if (sector.type === "jackpot") {
                canvas.classList.add("rainbow-mode");
                triggerExplosionEffect();

                const rewardCoins = sector.value;
                if (window.addCoinsToFirestore) await window.addCoinsToFirestore(rewardCoins);

                Swal.fire({
                    icon: 'success',
                    title: '👑 แจ็คพอตแตก! 10B Coin! 👑',
                    html: `<b style="color: #ffeb3b; font-size: 1.2rem;">ยินดีด้วย! คุณได้รับรางวัลใหญ่สูงสุด 10,000,000,000 Coin!</b>`,
                    background: '#1a1a2e',
                    color: '#fff',
                    confirmButtonText: spinCount >= maxSpins ? 'ไปหน้ามินิเกมกันต่อ!' : 'รับรางวัลเลย!',
                    confirmButtonColor: '#ff007f',
                    allowOutsideClick: false
                }).then(() => {
                    canvas.classList.remove("rainbow-mode");
                    checkAndRedirect();
                });

            } else if (sector.type === "secret") {
                canvas.classList.add("rainbow-mode");
                triggerExplosionEffect();

                const randomSecretB = Math.floor(Math.random() * 100) + 1; 
                const secretRewardCoins = randomSecretB * 1000000000;

                if (window.addCoinsToFirestore) await window.addCoinsToFirestore(secretRewardCoins);

                Swal.fire({
                    icon: 'success',
                    title: '🌈 โชคดีสุดขีด! รางวัลลับสีรุ้ง! 🌈',
                    html: `คุณเปิดเจอหีบสมบัติลับสุดยอด!<br><b style="color: #00ffff; font-size: 1.3rem;">ได้รับ HALLOWEEN Coin จำนวน ${randomSecretB}B Coin!</b>`,
                    background: '#1a1a2e',
                    color: '#fff',
                    confirmButtonText: spinCount >= maxSpins ? 'ไปหน้ามินิเกมกันต่อ!' : 'สุดยอดไปเลย!',
                    confirmButtonColor: '#9b59b6',
                    allowOutsideClick: false
                }).then(() => {
                    canvas.classList.remove("rainbow-mode");
                    checkAndRedirect();
                });

            } else {
                triggerNormalConfetti();
                const rewardCoins = sector.value;
                if (window.addCoinsToFirestore) await window.addCoinsToFirestore(rewardCoins);

                Swal.fire({
                    icon: 'success',
                    title: '🎉 ยินดีด้วย!',
                    html: `คุณได้รับ <b style="color: #ffeb3b; font-size: 1.1rem;">${sector.label}</b> เข้าสู่บัญชีเรียบร้อยแล้ว!`,
                    background: '#1a1a2e',
                    color: '#fff',
                    timer: 2500,
                    showConfirmButton: spinCount >= maxSpins,
                    confirmButtonText: 'ไปหน้ามินิเกม',
                    confirmButtonColor: '#ff9000',
                    allowOutsideClick: false
                }).then(() => {
                    checkAndRedirect();
                });
            }
        }

        // ฟังก์ชันเปลี่ยนหน้าไป minigame_.html ทันทีเมื่อครบ 3 ครั้ง โดยไม่มี popup แจ้งเตือนซ้ำซ้อน
        function checkAndRedirect() {
            if (spinCount >= maxSpins) {
                window.location.href = "minigame.html";
            }
        }

        function triggerNormalConfetti() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function triggerExplosionEffect() {
            var duration = 2.5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.9), y: randomInRange(0.1, 0.4) } }));
            }, 250);
        }
    </script>
</body>
</html>
