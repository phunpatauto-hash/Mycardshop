<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY COLLECTION - Arena Sync System</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Kanit', sans-serif; 
            margin: 0; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%); 
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Navbar */
        .navbar { 
            background-color: rgba(10, 10, 15, 0.9); 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #ffc831; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            backdrop-filter: blur(20px); 
            height: 85px; 
        }
        .user-name-tag { color: #ffc831; font-weight: bold; font-size: 1.1rem; text-transform: uppercase; }
        .nav-buttons { display: flex; gap: 12px; margin-top: 5px; }
        .btn-nav { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 12px; text-decoration: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-nav.primary { background: linear-gradient(45deg, #ffc831, #ff9000); color: #000; border: none; }
        .btn-nav.achievement { background: linear-gradient(45deg, #ff2a6d, #9a00e6); color: #fff; border: none; }
        .wallet-display { display: flex; gap: 15px; }
        .wallet-box { background: rgba(255, 255, 255, 0.05); padding: 8px 16px; border-radius: 25px; border: 1.5px solid #333; display: flex; align-items: center; gap: 8px; font-weight: bold; }

        /* Control Panel */
        .control-panel { max-width: 1200px; margin: 25px auto 10px; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .search-sort-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .search-input { background: rgba(255,255,255,0.05); border: 1px solid #444; padding: 10px 20px; border-radius: 12px; color: white; font-family: 'Kanit'; width: 300px; outline: none; transition: 0.3s; }
        .search-input:focus { border-color: #ffc831; box-shadow: 0 0 10px rgba(255,200,49,0.2); }
        .sort-select { background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 12px; font-family: 'Kanit'; cursor: pointer; outline: none; }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .filter-btn { padding: 8px 18px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #aaa; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .filter-btn.active { border-color: #ffc831; color: #fff; background: rgba(255,200,49,0.1); }

        /* Effects */
        @keyframes rainbow-rotate { 100% { filter: hue-rotate(360deg); } }
        .rainbow-effect { border: 3px solid transparent !important; background: linear-gradient(#111, #111) padding-box, conic-gradient(from 0deg, red, yellow, lime, aqua, blue, magenta, red) border-box !important; animation: rainbow-rotate 3s linear infinite; box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* Animation สำหรับการ์ดใหม่หรือมีการ์ดซ้ำกระพริบเรืองแสงเบาๆ */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px rgba(255, 200, 49, 0.4), inset 0 0 5px rgba(255, 200, 49, 0.2); }
            50% { box-shadow: 0 0 20px rgba(255, 200, 49, 0.8), inset 0 0 8px rgba(255, 200, 49, 0.4); }
            100% { box-shadow: 0 0 5px rgba(255, 200, 49, 0.4), inset 0 0 5px rgba(255, 200, 49, 0.2); }
        }
        .card-pulse-new {
            animation: pulse-glow 1.8s infinite ease-in-out;
        }

        /* Grid & Cards */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .col-card { background: #111; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; transition: 0.3s; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .col-card:hover { transform: translateY(-8px); border-color: #ffc831; box-shadow: 0 0 20px rgba(255, 200, 49, 0.3); }
        .col-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; transition: 0.3s; }
        .star-container { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 8px; color: #ffc831; font-size: 0.7rem; z-index: 5; backdrop-filter: blur(5px); }
        .card-count-badge { position: absolute; top: 8px; right: 8px; background: #ffc831; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; z-index: 5; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        /* Lock Indicator Badge */
        .card-lock-badge { position: absolute; bottom: 75px; right: 8px; background: rgba(0,0,0,0.75); color: #ff4d4d; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; z-index: 5; border: 1px solid #ff4d4d; }

        /* Upgrade Available Arrow Badge */
        @keyframes bounce-arrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .card-upgrade-badge {
            position: absolute;
            bottom: 75px;
            left: 8px;
            background: linear-gradient(135deg, #00ff88, #00d4ff);
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            animation: bounce-arrow 1.2s infinite ease-in-out;
        }

        /* Achievement Popup Styles */
        .ach-modal-content { background: #0b0b12; border-radius: 20px; max-width: 1000px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; border: 1px solid #333; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
        .ach-header { padding: 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .ach-body { padding: 20px; overflow-y: auto; flex: 1; }
        
        /* Milestone Rewards */
        .milestone-box { background: rgba(255, 200, 49, 0.05); border: 1px solid rgba(255, 200, 49, 0.3); border-radius: 15px; padding: 15px; margin-bottom: 25px; }
        .milestone-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
        .milestone-card { background: rgba(0,0,0,0.4); border: 1px solid #333; padding: 12px; border-radius: 10px; text-align: center; }
        .milestone-card.completed { border-color: #ffc831; background: rgba(255, 200, 49, 0.1); }

        .achievement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .ach-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; border: 1px solid #333; position: relative; transition: 0.3s; }
        .ach-card.completed { border-color: #ffc831; background: rgba(255,200,49,0.05); box-shadow: 0 0 15px rgba(255,200,49,0.1); }
        .ach-card.claimed { opacity: 0.6; filter: grayscale(0.5); }
        .ach-tier { font-size: 0.7rem; font-weight: bold; padding: 3px 8px; border-radius: 5px; text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        .tier-easy { background: #4caf50; color: white; }
        .tier-medium { background: #2196f3; color: white; }
        .tier-hard { background: #f44336; color: white; }
        .tier-impossible { background: #9c27b0; color: white; animation: rainbow-rotate 3s linear infinite; }
        .tier-secret { background: #000; color: #ffc831; border: 1px solid #ffc831; }
        .ach-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; color: #fff; }
        .ach-desc { font-size: 0.85rem; color: #aaa; margin-bottom: 15px; min-height: 40px; }
        .ach-progress-container { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .ach-progress-bar { height: 100%; background: #ffc831; width: 0%; transition: 0.5s; }
        .btn-claim { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #ffc831; color: #000; transition: 0.3s; }
        .btn-claim:disabled { background: #444; color: #888; cursor: not-allowed; }
        .reward-tag { font-size: 0.8rem; color: #ffc831; margin-bottom: 10px; display: block; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-content { background: #0a0a0f; border-radius: 25px; max-width: 900px; width: 100%; display: flex; overflow: hidden; border: 1px solid #333; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .modal-left { width: 45%; background: #000; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; }
        .modal-right { width: 55%; padding: 35px; display: flex; flex-direction: column; background: linear-gradient(135deg, #0a0a0f 0%, #111 100%); max-height: 90vh; overflow-y: auto; }
        .stat-item { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; border-left: 4px solid #ffc831; margin: 10px 0; }
        .stat-val { font-size: 1.8rem; font-weight: bold; display: block; color: #ffc831; }
        .stat-lbl { font-size: 0.75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .lvl-bar-bg { width: 100%; height: 10px; background: #222; border-radius: 10px; margin: 8px 0; overflow: hidden; }
        .lvl-bar-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); width: 0%; transition: 0.5s; }
        .btn-action { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; font-size: 1rem; }
        .btn-lv { background: #0066ff; color: white; }
        .btn-star { background: #ff9900; color: black; }
        .btn-sell-single { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1.5px solid #ff4d4d; padding: 8px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-sell-all { background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-lock { background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-lock.locked { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border-color: #ff4d4d; }

        @media (max-width: 768px) { .modal-content { flex-direction: column; overflow-y: auto; } .modal-left, .modal-right { width: 100%; } .search-input { width: 100%; } }
        .tier-divine {
            border: 2px solid #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), rgba(186, 0, 255, 0.1));
        }
        .tier-divine .ach-title {
            color: #00f2ff;
            text-shadow: 0 0 5px #00f2ff;
        }
    </style>
</head>

    function getArenaPower(card) {
        const r = (card.rarity || 'C').toUpperCase();
        const config = RARITY_POWER[r] || RARITY_POWER['C'];
        return Math.floor((config.base + (card.level * config.perLv)) * (1 + ((card.stars||0) * 0.1)));
    }

    function getCardHp(card) {
        const r = (card.rarity || 'C').toUpperCase();
        const config = RARITY_POWER[r] || RARITY_POWER['C'];
        return Math.floor((config.baseHp + (card.level * config.perLvHp)) * (1 + ((card.stars||0) * 0.15)));
    }

    function getCardDef(card) {
        const r = (card.rarity || 'C').toUpperCase();
        const config = RARITY_POWER[r] || RARITY_POWER['C'];
        return Math.floor((config.baseDef + (card.level * config.perLvDef)) * (1 + ((card.stars||0) * 0.12)));
    }

    function getDynamicSellValue(card) {
        const r = (card.rarity||'C').toUpperCase();
        const base = sellValuesBase[r] || 100;
        return Math.floor(base * (1 + ((card.level||1) - 1) * 0.1));
    }

    function getUpgradeRequirements(card) {
        const r = (card.rarity || 'C').toUpperCase();
        const lv = card.level || 1;
        if (r === 'USEC' || r === 'EXR' || r === 'SECRET') {
            if (lv <= 45) return { reqQty: 1, cost: 500 };
            return { reqQty: 2, cost: 1500 }; 
        }
        if (lv <= 35) return { reqQty: 1, cost: 500 };
        if (lv <= 65) return { reqQty: 2, cost: 1500 };
        return { reqQty: 3, cost: 2000 };
    }

    // ฟังก์ชันเช็คว่าการ์ดใบนี้สามารถอัปเกรดได้จริงหรือไม่ (ใช้เช็คแสดงไอคอนลูกศร)
    function canCardBeUpgraded(card, allCards, currentPts) {
        const r = (card.rarity || 'C').toUpperCase();
        const unlockedCopies = allCards.filter(c => c.name === card.name && (c.rarity || 'C').toUpperCase() === r && !c.isLocked);
        
        // หากเป็นการ์ดหลักตัวนี้ ให้หักจำนวนออก 1 ใบ (เพราะตัวหลักไม่ใช่ใบวัตถุดิบ)
        const availableMaterialsCount = unlockedCopies.length > 0 ? unlockedCopies.length - 1 : 0;

        if (card.level < MAX_LV) {
            const req = getUpgradeRequirements(card);
            return availableMaterialsCount >= req.reqQty && currentPts >= req.cost;
        } else if (card.stars < 5) {
            return availableMaterialsCount >= 2; // อัปดาวต้องใช้ 2 ใบซ้ำ
        }
        return false;
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUID = user.uid;
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    let rawCollection = data.collection || [];

                    userCards = rawCollection.map(c => ({
                        ...c, 
                        level: c.level || 1, 
                        stars: c.stars || 0, 
                        isLocked: c.isLocked || false,
                        img: c.img || c.image
                    }));
                    
                    globalPoints = data.points || 0;
                    const diamonds = data.diamonds || 0;
                    const tickets = data.normal_tickets || data.tickets || 0;
                    const premiumTickets = data.premium_tickets || 0;
                    const stars = data.stars || 0;

                    document.getElementById("pts").innerText = globalPoints.toLocaleString();
                    document.getElementById("dia").innerText = diamonds.toLocaleString();
                    document.getElementById("ticket").innerText = tickets.toLocaleString();
                    document.getElementById("p-ticket").innerText = premiumTickets.toLocaleString();
                    document.getElementById("star").innerText = stars.toLocaleString();

    function renderCards() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        const grouped = {};
        
        userCards.forEach(card => {
            const key = `${card.name}_${(card.rarity||'C').toUpperCase()}`;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(card);
        });
        
        let displayList = [];
        for (const key in grouped) {
            const copies = grouped[key];
            copies.sort((a, b) => {
                if (a.isLocked !== b.isLocked) return b.isLocked ? 1 : -1;
                return ((b.stars||0)*100 + b.level) - ((a.stars||0)*100 + a.level);
            });
            displayList.push({...copies[0], count: copies.length});
        }
        if (currentFilter !== 'ALL') displayList = displayList.filter(c => (c.rarity||'C').toUpperCase() === currentFilter);
        if (searchQuery) displayList = displayList.filter(c => c.name.toLowerCase().includes(searchQuery.toLowerCase()));
        
        const sortType = document.getElementById("sortSelect").value;
        displayList.sort((a, b) => {
            if (sortType === 'power_desc') return getArenaPower(b) - getArenaPower(a);
            if (sortType === 'power_asc') return getArenaPower(a) - getArenaPower(b);
            if (sortType === 'rarity_desc') {
                const rA = (a.rarity||'C').toUpperCase();
                const rB = (b.rarity||'C').toUpperCase();
                return (rarityOrder[rB] || 0) - (rarityOrder[rA] || 0);
            }
            if (sortType === 'rarity_asc') {
                const rA = (a.rarity||'C').toUpperCase();
                const rB = (b.rarity||'C').toUpperCase();
                return (rarityOrder[rA] || 0) - (rarityOrder[rB] || 0);
            }
            if (sortType === 'lv_desc') return b.level - a.level;
            if (sortType === 'lv_asc') return a.level - b.level;
            return 0;
        });

        const FIVE_MINUTES = 5 * 60 * 1000;
        const now = Date.now();

        displayList.forEach(card => {
            const r = (card.rarity||'C').toUpperCase();
            
            // เอฟเฟกต์กระพริบ: บอกว่าเป็นการ์ดใหม่ (ได้มาไม่เกิน 5 นาที) หรือมีใบซ้ำ
            const isRecentNew = card.obtainedAt && (now - card.obtainedAt < FIVE_MINUTES);
            const hasDuplicates = card.count > 1;
            const shouldPulse = isRecentNew || hasDuplicates;

            // เช็คว่าสามารถอัปเกรดได้จริงๆ หรือไม่ เพื่อแสดงลูกศรชี้ขึ้น
            const canUpgrade = canCardBeUpgraded(card, userCards, globalPoints);

            const div = document.createElement("div");
            div.className = `col-card ${card.level >= MAX_LV && card.stars >= 5 ? 'rainbow-effect' : (shouldPulse ? 'card-pulse-new' : '')}`;
            div.style.border = `1px solid ${rarityColors[r] || '#fff'}44`;
            div.onclick = () => openModal(card);
            div.innerHTML = `
                ${card.stars > 0 ? `<div class="star-container">${'⭐'.repeat(card.stars)}</div>` : ''}
                ${card.count > 1 ? `<div class="card-count-badge">x${card.count}</div>` : ''}
                ${card.isLocked ? `<div class="card-lock-badge">🔒</div>` : ''}
                ${canUpgrade ? `<div class="card-upgrade-badge" title="สามารถอัปเกรดได้!">⬆️</div>` : ''}
                <img src="${card.img || card.image}">
                <div style="padding:10px; background: rgba(0,0,0,0.8);">
                    <div style="color:${rarityColors[r] || '#fff'}; font-size:0.75rem; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${card.name}</div>
                    <div style="color:#ffc831; font-size:0.8rem; font-weight:bold;">⚡ ${getArenaPower(card).toLocaleString()}</div>
                    <div style="color:#aaa; font-size:0.65rem;">LV. ${card.level}</div>
                </div>`;
            grid.appendChild(div);
        });
    }

    function checkAchProgress(ach, userData) {
        const uniqueCardsCount = new Set(userCards.map(c => `${c.name}_${(c.rarity||'C').toUpperCase()}`)).size;
        const points = userData.points || 0;
        const arenaCount = userData.arenaBattles || 0; 
        const timeInCollection = userData.collectionTime || 0;
        
        switch(ach.id) {
            case 'starter_collector': return Math.min(uniqueCardsCount, ach.goal);
            case 'expert_collector': return Math.min(uniqueCardsCount, ach.goal);
            case 'lv80_easy': return userCards.filter(c => (parseInt(c.level) || 0) >= 80 && (parseInt(c.stars) || 0) >= 5).length;
            case 'lv80_medium': return userCards.filter(c => (parseInt(c.level) || 0) >= 80 && (parseInt(c.stars) || 0) >= 5).length;
            case 'lv80_hard': return userCards.filter(c => (parseInt(c.level) || 0) >= 80 && (parseInt(c.stars) || 0) >= 5).length;
            case 'lv80_impossible': return userCards.filter(c => (parseInt(c.level) || 0) >= 80 && (parseInt(c.stars) || 0) >= 5).length;
            case 'god_tier': return userCards.some(c => ['USEC', 'EXR'].includes((c.rarity||'').toUpperCase())) ? 1 : 0;
            case 'rainbow_master': return userCards.some(c => (c.level||1) >= 80 && (c.stars||0) >= 5) ? 1 : 0;
            case 'whale_secret_usec': 
                return userCards.filter(c => 
                    (c.rarity || '').toUpperCase() === 'USEC' && 
                    (c.level || 1) >= 80 && 
                    (c.stars || 0) >= 5
                ).length;
            case 'whale_secret_exr': 
                return userCards.filter(c => 
                    (c.rarity || '').toUpperCase() === 'EXR' && 
                    (c.level || 1) >= 80 && 
                    (c.stars || 0) >= 5
                ).length;
            case 'whale_secret_SECRET': 
                return userCards.filter(c => 
                    (c.rarity || '').toUpperCase() === 'SECRET' && 
                    (c.level || 1) >= 80 && 
                    (c.stars || 0) >= 5
                ).length;
            case 'p_collector_secret':
                return userCards.some(c => (c.rarity || '').toUpperCase() === 'P') ? 1 : 0;
            case 'arena_starter':
            case 'arena_adept':
            case 'arena_expert':
            case 'arena_legend_secret':
                return Math.min(arenaCount, ach.goal);
            case 'whale_secret_coins': return points >= ach.goal ? ach.goal : points;
            case 'power_Full_Allcollector': return userCards.filter(c => (parseInt(c.level) || 0) >= 80 && (parseInt(c.stars) || 0) >= 5).length;
            case 'arena_divine': return Math.min(arenaCount, 500);
            case 'collection_time_2h': return Math.min(timeInCollection, ach.goal);
            default: return 0;
        }
    }

    function renderAchievements(userData) {
        const grid = document.getElementById("achievementGrid");
        grid.innerHTML = "";
        const claimedAchs = userData.claimedAchievements || [];
        const claimedMilestones = userData.claimedMilestones || [];

        let completedTotalCount = 0;

        ACHIEVEMENTS_DATA.forEach(ach => {
            const progress = checkAchProgress(ach, userData);
            const isCompleted = progress >= ach.goal;
            const isClaimed = claimedAchs.includes(ach.id);
            const percent = (progress / ach.goal) * 100;

            if (isCompleted) completedTotalCount++;

            const card = document.createElement("div");
            card.className = `ach-card ${isCompleted ? 'completed' : ''} ${isClaimed ? 'claimed' : ''}`;
            
            const isSecret = ach.tier === 'secret';
            const displayTitle = (isSecret && !isCompleted) ? "ภารกิจลับที่ยังไม่เปิดเผย" : ach.title;
            const displayDesc = (isSecret && !isCompleted) ? "เงื่อนไข: เป็นความลับจนกว่าจะทำสำเร็จ" : ach.desc;
            const displayTier = (isSecret && !isCompleted) ? "???" : ach.tier;

            const progressDisplay = ach.id === 'collection_time_2h' 
                ? `${Math.floor(progress / 60)} / ${Math.floor(ach.goal / 60)} นาที` 
                : `${progress.toLocaleString()} / ${ach.goal.toLocaleString()}`;

            card.innerHTML = `
                <span class="ach-tier tier-${ach.tier}">${displayTier}</span>
                <div class="ach-title">${displayTitle}</div>
                <div class="ach-desc">${displayDesc}</div>
                <span class="reward-tag">🎁 ${ach.reward.points > 0 ? ach.reward.points.toLocaleString() + ' 🪙' : ''} ${ach.reward.diamonds > 0 ? ach.reward.diamonds.toLocaleString() + ' 💎' : ''}</span>
                <div class="ach-progress-container">
                    <div class="ach-progress-bar" style="width: ${percent}%"></div>
                </div>
                <div style="font-size: 0.75rem; color: #888; margin-bottom: 12px;">
                    ความคืบหน้า: ${progressDisplay}
                </div>
                <button class="btn-claim" 
                    ${!isCompleted || isClaimed ? 'disabled' : ''} 
                    onclick="claimReward('${ach.id}')">
                    ${isClaimed ? 'รับรางวัลแล้ว' : (isCompleted ? 'รับของรางวัล' : 'ยังไม่สำเร็จ')}
                </button>
            `;
            grid.appendChild(card);
        });

        document.getElementById("totalAchCount").innerText = completedTotalCount;
        document.getElementById("milestoneBarFill").style.width = Math.min((completedTotalCount / 20) * 100, 100) + "%";
        
        const mGrid = document.getElementById("milestoneGrid");
        mGrid.innerHTML = "";
        MILESTONES.forEach(ms => {
            const isReached = completedTotalCount >= ms.goal;
            const isClaimed = claimedMilestones.includes(ms.goal);

            const msDiv = document.createElement("div");
            msDiv.className = `milestone-card ${isReached ? 'completed' : ''}`;
            msDiv.innerHTML = `
                <div style="font-weight:bold; color:${isReached ? '#ffc831' : '#fff'};">${ms.title}</div>
                <div style="font-size:0.75rem; color:#aaa; margin:5px 0;">🎁 ${ms.reward.points.toLocaleString()} 🪙 | ${ms.reward.diamonds.toLocaleString()} 💎</div>
                <button class="btn-claim" style="font-size:0.75rem; padding:5px;"
                    ${!isReached || isClaimed ? 'disabled' : ''} 
                    onclick="claimMilestoneReward(${ms.goal})">
                    ${isClaimed ? 'รับแล้ว' : (isReached ? 'รับรางวัล' : 'ยังไม่ถึง')}
                </button>
            `;
            mGrid.appendChild(msDiv);
        });
    }

    window.claimReward = async (achId) => {
        const ach = ACHIEVEMENTS_DATA.find(a => a.id === achId);
        if (!ach || !currentUID) return;

        const userDocRef = doc(db, "users", currentUID);
        try {
            await updateDoc(userDocRef, {
                points: increment(ach.reward.points || 0),
                diamonds: increment(ach.reward.diamonds || 0),
                claimedAchievements: arrayUnion(achId)
            });
            alert(`🎉 ยินดีด้วย! คุณได้รับรางวัลจากความสำเร็จ: ${ach.title}\n💎 +${ach.reward.diamonds} | 🪙 +${ach.reward.points}`);
        } catch (e) {
            console.error("Error claiming reward:", e);
            alert("เกิดข้อผิดพลาดในการรับรางวัล");
        }
    };

    window.claimMilestoneReward = async (goal) => {
        const ms = MILESTONES.find(m => m.goal === goal);
        if (!ms || !currentUID) return;

        const userDocRef = doc(db, "users", currentUID);
        try {
            await updateDoc(userDocRef, {
                points: increment(ms.reward.points || 0),
                diamonds: increment(ms.reward.diamonds || 0),
                claimedMilestones: arrayUnion(goal)
            });
            alert(`🎉 ยินดีด้วย! คุณได้รับรางวัลการทำสะสมครบ ${goal} อัน\n💎 +${ms.reward.diamonds.toLocaleString()} | 🪙 +${ms.reward.points.toLocaleString()}`);
        } catch (e) {
            console.error("Error claiming milestone reward:", e);
            alert("เกิดข้อผิดพลาดในการรับรางวัลสะสม");
        }
    };

    window.openModal = (card) => {
        const r = (card.rarity||'C').toUpperCase();
        const sameCards = userCards.filter(c => c.name === card.name && (c.rarity||'C').toUpperCase() === r);
        
        document.getElementById("modalImg").src = card.img || card.image;
        document.getElementById("modalName").innerText = card.name;
        document.getElementById("modalRarity").innerText = "GRADE: " + r;
        document.getElementById("modalRarity").style.color = rarityColors[r] || '#fff';
        document.getElementById("modalPower").innerText = getArenaPower(card).toLocaleString();
        document.getElementById("modalHp").innerText = getCardHp(card).toLocaleString();
        document.getElementById("modalDef").innerText = getCardDef(card).toLocaleString();
        document.getElementById("modalLvlDisplay").innerText = "LV. " + card.level;
        document.getElementById("lvlBarFill").style.width = (card.level/MAX_LV*100) + "%";
        document.getElementById("reqQty").innerText = sameCards.length;
        document.getElementById("modalSellPrice").innerText = getDynamicSellValue(card).toLocaleString() + " 🪙";

        const lockBtn = document.getElementById("btnLockCard");
        if (card.isLocked) {
            lockBtn.innerText = "🔒 ล็อกอยู่";
            lockBtn.classList.add("locked");
        } else {
            lockBtn.innerText = "🔓 ปลดล็อกอยู่";
            lockBtn.classList.remove("locked");
        }
        lockBtn.onclick = () => handleToggleLock(card);

        const lvGroup = document.getElementById("lvUpgradeGroup"), starBtn = document.getElementById("btnUpgradeStar"), maxMsg = document.getElementById("maxLevelMessage");
        
        if (card.level < MAX_LV) {
            lvGroup.style.display = "flex"; starBtn.style.display = "none"; maxMsg.style.display = "none";
            const req = getUpgradeRequirements(card);
            document.getElementById("modalUpgradeInfo").innerText = `เงื่อนไข: ใช้ใบซ้ำ ${req.reqQty} ใบ + ${req.cost} 🪙`;
            document.getElementById("btnUpgradeLV").onclick = () => handleUpgrade(card, 'LV');
            document.getElementById("btnBulkUpgrade").onclick = () => handleUpgrade(card, 'BULK');
        } else {
            lvGroup.style.display = "none";
            if (card.stars < 5) {
                starBtn.style.display = "block"; maxMsg.style.display = "block";
                maxMsg.innerText = "✨ พร้อมวิวัฒนาการ (ใช้ 2 ใบซ้ำ) ✨";
                starBtn.onclick = () => handleUpgrade(card, 'STAR', (card.stars+1)*1000);
            } else {
                starBtn.style.display = "none"; maxMsg.style.display = "block";
                maxMsg.innerText = "🌈 FULL POWER 🌈";
            }
        }
        document.getElementById("btnSellCard").onclick = () => handleSingleSell(card);
        document.getElementById("cardModal").style.display = "flex";
    };

    async function saveStateToFirebase(updatedLocalCollection) {
        const userDocRef = doc(db, "users", currentUID);
        await updateDoc(userDocRef, {
            collection: updatedLocalCollection
        });
    }

    async function handleToggleLock(card) {
        let updated = [...userCards];
        const idx = updated.findIndex(c => c.name === card.name && (c.rarity||'').toUpperCase() === (card.rarity||'').toUpperCase() && c.level === card.level && c.stars === card.stars);
        if (idx > -1) {
            updated[idx].isLocked = !updated[idx].isLocked;
            await saveStateToFirebase(updated);
            
            const lockBtn = document.getElementById("btnLockCard");
            if (updated[idx].isLocked) {
                lockBtn.innerText = "🔒 ล็อกอยู่";
                lockBtn.classList.add("locked");
            } else {
                lockBtn.innerText = "🔓 ปลดล็อกอยู่";
                lockBtn.classList.remove("locked");
            }
        }
    }

    async function handleUpgrade(card, type, starCost = 0) {
        const userDocRef = doc(db, "users", currentUID);
        const userSnap = await getDoc(userDocRef);
        if (!userSnap.exists()) return;
        
        let data = userSnap.data();
        let currentPoints = data.points || 0;
        let currentDiamonds = data.diamonds || 0;

        let localCollection = [...userCards];

        let mainIdx = localCollection.findIndex(c => c.name === card.name && (c.rarity||'').toUpperCase() === (card.rarity||'').toUpperCase() && (c.level||1) === card.level && (c.stars||0) === card.stars);
        if (mainIdx === -1) return alert("ไม่พบการ์ดหลัก");

        let totalCostPoints = 0;
        let totalCostDiamonds = 0;
        let upgraded = false;

        if (type === 'LV' || type === 'BULK') {
            while (localCollection[mainIdx].level < MAX_LV) {
                const req = getUpgradeRequirements(localCollection[mainIdx]);
                let materialIndices = [];
                for (let i = 0; i < localCollection.length; i++) {
                    if (i !== mainIdx && localCollection[i].name === card.name && (localCollection[i].rarity||'').toUpperCase() === (card.rarity||'').toUpperCase() && !localCollection[i].isLocked) {
                        materialIndices.push(i);
                        if (materialIndices.length >= req.reqQty) break;
                    }
                }
                if (materialIndices.length < req.reqQty || currentPoints < (totalCostPoints + req.cost)) {
                    if (type === 'LV') {
                        if (materialIndices.length < req.reqQty) alert(`ใบซ้ำที่ไม่ได้ล็อกมีไม่พอ (ต้องการ ${req.reqQty} ใบ)`);
                        else alert("Coins ไม่พอ");
                    }
                    break;
                }
                materialIndices.sort((a, b) => b - a).forEach(idx => {
                    localCollection.splice(idx, 1);
                    if (idx < mainIdx) mainIdx--;
                });
                localCollection[mainIdx].level = (localCollection[mainIdx].level || 1) + 1;
                totalCostPoints += req.cost;
                upgraded = true;
                if (type === 'LV') break;
            }
        } else if (type === 'STAR') {
            let reqQty = 2;
            let materialIndices = [];
            for (let i = 0; i < localCollection.length; i++) {
                if (i !== mainIdx && localCollection[i].name === card.name && (localCollection[i].rarity||'').toUpperCase() === (card.rarity||'').toUpperCase() && !localCollection[i].isLocked) {
                    materialIndices.push(i);
                    if (materialIndices.length >= reqQty) break;
                }
            }
            if (materialIndices.length < reqQty) return alert("ต้องการใบซ้ำที่ไม่ได้ล็อก 2 ใบเพื่ออัปดาว");
            if (currentDiamonds < starCost) return alert("Diamonds ไม่พอ");
            materialIndices.sort((a, b) => b - a).forEach(idx => {
                localCollection.splice(idx, 1);
                if (idx < mainIdx) mainIdx--;
            });
            localCollection[mainIdx].stars = (localCollection[mainIdx].stars || 0) + 1;
            totalCostDiamonds = starCost;
            upgraded = true;
        }

        if (upgraded) {
            await saveStateToFirebase(localCollection);
            await updateDoc(userDocRef, { 
                points: increment(-totalCostPoints),
                diamonds: increment(-totalCostDiamonds)
            });
            document.getElementById("cardModal").style.display = "none";
        }
    }

    async function handleSingleSell(card) {
        if (card.isLocked) return alert("❌ ไม่สามารถขายได้เนื่องจากเปิดระบบล็อกการ์ดไว้ ปลดล็อกก่อนทำการขาย!");
        if(!confirm(`ขายการ์ด ${card.name} หรือไม่?`)) return;
        let updated = [...userCards];
        const idx = updated.findIndex(c => c.name === card.name && (c.rarity||'').toUpperCase() === (card.rarity||'').toUpperCase() && c.level === card.level && c.stars === card.stars);
        if(idx > -1) {
            const gain = getDynamicSellValue(card);
            updated.splice(idx, 1);
            await saveStateToFirebase(updated);
            await updateDoc(doc(db, "users", currentUID), { points: increment(gain) });
            document.getElementById("cardModal").style.display = "none";
        }
    }

    document.getElementById("btnSellAll").onclick = async () => {
        if (!confirm("ระบบจะเก็บการ์ดที่เลเวลและดาวสูงสุดไว้ 1 ใบ และขายใบซ้ำอื่นที่ไม่ได้ล็อกทิ้งทั้งหมด ยืนยันหรือไม่?")) return;
        const grouped = {};
        userCards.forEach(card => {
            const key = `${card.name}_${(card.rarity||'C').toUpperCase()}`;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(card);
        });
        let newCollection = [], totalGain = 0, sellCount = 0;
        for (const key in grouped) {
            const copies = grouped[key];
            copies.sort((a, b) => ((b.stars||0)*100 + b.level) - ((a.stars||0)*100 + a.level));
            
            newCollection.push(copies[0]); 
            for (let i = 1; i < copies.length; i++) {
                if (copies[i].isLocked) {
                    newCollection.push(copies[i]); 
                } else {
                    totalGain += getDynamicSellValue(copies[i]);
                    sellCount++;
                }
            }
        }
        if (sellCount === 0) return alert("ไม่มีใบซ้ำที่ปลดล็อกเหลือให้ขาย");
        
        await saveStateToFirebase(newCollection);
        await updateDoc(doc(db, "users", currentUID), { points: increment(totalGain) });
        alert(`ขายการ์ดซ้ำสำเร็จทั้งหมด ${sellCount} ใบ ได้รับ ${totalGain.toLocaleString()} 🪙`);
    };

    document.getElementById("searchInput").oninput = (e) => { searchQuery = e.target.value; renderCards(); };
    document.getElementById("sortSelect").onchange = () => renderCards();
    
    const fCon = document.getElementById("filterContainer");
    ['ALL','SECRET','P','USEC','EXR','CBR','SEC','SUR','SSR','PR','UR','SR','R','U','C'].forEach(r => {
        const btn = document.createElement("button");
        btn.className = `filter-btn ${r === 'ALL' ? 'active' : ''}`;
        btn.innerText = r;
        btn.onclick = () => {
            currentFilter = r;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        };
        fCon.appendChild(btn);
    });

    let sessionSeconds = 0;
    let timerInterval = null;

    function startTimer() {
        if (!timerInterval) {
            timerInterval = setInterval(() => {
                sessionSeconds++;
            }, 1000);
        }
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    async function saveElapsedTime() {
        if (!currentUID || sessionSeconds === 0) return;
        const secondsToSave = sessionSeconds;
        sessionSeconds = 0;

        try {
            const userDocRef = doc(db, "users", currentUID);
            await updateDoc(userDocRef, {
                collectionTime: increment(secondsToSave)
            });
        } catch (e) {
            console.error("Error saving collection time:", e);
        }
    }

    startTimer();

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopTimer();
            saveElapsedTime();
        } else {
            startTimer();
        }
    });

    window.addEventListener("beforeunload", () => {
        saveElapsedTime();
    });
</script>
</body>
