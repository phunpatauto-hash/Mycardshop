<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARENA AUCTION - LIVE RAFFLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --gold: #ffc831; 
            --dark-bg: #111; 
            --box-bg: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body { 
            background: #a3f141; /* พื้นหลังสีเขียวสดใสตามธีมในรูปภาพ */
            background-image: radial-gradient(circle, #c2f765 20%, #a3f141 80%);
            color: #000; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        /* --- Navbar ดึงข้อมูลผู้ใช้จริง --- */
        .navbar { 
            background-color: #000; 
            width: 100%; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid #000;
            color: #fff;
        }
        .user-stat { 
            color: var(--gold); 
            font-weight: 900; 
            font-size: 1.2rem;
            text-shadow: 1px 1px 0px #000;
        }
        .btn-home { 
            background: #fff; 
            border: 3px solid #000; 
            color: #000; 
            padding: 6px 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none; 
            box-shadow: 0 4px 0 #000;
        }
        .btn-home:active { transform: translateY(4px); box-shadow: none; }

        /* --- Main Layout สไตล์ UI การ์ตูนหนาๆ ตามบอร์ดเกม --- */
        .main-layout { 
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px; 
            width: 95%; 
            max-width: 1050px; 
            margin-top: 25px; 
            margin-bottom: 50px;
        }
        
        /* การจัดบล็อกสไตล์บอร์ดเกม (กรอบเส้นดำหนา) */
        .game-panel {
            background: var(--box-bg);
            border: 5px solid #000;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 0 #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* --- ฝั่งซ้าย: แสดงการ์ดที่กำลังประมูลหลัก --- */
        .timer-banner {
            background: #ff4757;
            color: white;
            border: 4px solid #000;
            padding: 5px 20px;
            border-radius: 15px;
            font-size: 2.2rem;
            font-weight: 900;
            box-shadow: 0 5px 0 #000;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .card-frame { 
            width: 240px; 
            height: 330px; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 5px solid #000; 
            background: #000; 
            box-shadow: 5px 5px 0 rgba(0,0,0,0.15);
            position: relative; 
        }
        .card-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .rarity-tag { 
            padding: 5px 25px; 
            border-radius: 10px; 
            font-weight: 900; 
            font-size: 1.3rem; 
            margin: 12px 0; 
            border: 3px solid #000;
            text-transform: uppercase; 
            color: #fff; 
            box-shadow: 0 4px 0 #000;
        }

        /* --- ฝั่งขวา: แผงควบคุมราคาบิด สู้ราคาด่วน และประวัติผู้ร่วมบิด --- */
        .section-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0 0 15px 0;
            text-align: center;
            text-transform: uppercase;
        }

        .pool-stats { 
            width: 100%;
            padding: 15px; 
            background: #fff8e1; 
            border-radius: 15px; 
            border: 3px solid #000; 
            text-align: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .bid-input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 15px; 
            border: 4px solid #000; 
            background: #fff; 
            color: #000; 
            font-size: 1.6rem; 
            font-weight: 900;
            text-align: center; 
            margin-bottom: 12px; 
            outline: none;
        }

        .btn-bid { 
            width: 100%; 
            padding: 15px; 
            background: #ff9000; 
            color: #fff; 
            border: 4px solid #000; 
            border-radius: 15px; 
            font-weight: 900; 
            font-size: 1.5rem; 
            cursor: pointer; 
            box-shadow: 0 6px 0 #000;
            text-shadow: 2px 2px 0 #000;
        }
        .btn-bid:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

        /* ปุ่มลัดเพิ่มราคาสไตล์เกม */
        .quick-bid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .btn-quick {
            background: #00e5ff;
            border: 3px solid #000;
            padding: 8px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
        }
        .btn-quick:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }

        /* รายการประวัติคนบิดล่าสุดด้านล่าง */
        .history-box {
            width: 100%;
            background: #f5f5f5;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 12px;
            max-height: 180px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            background: #fff;
            border: 2px solid #000;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* กล่องส่องใบถัดไปมุมล่าง */
        .next-card-panel {
            margin-top: 15px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f9f9f9;
            border: 3px solid #000;
            padding: 10px;
            border-radius: 15px;
        }
        .next-frame { width: 60px; height: 85px; border: 2px solid #000; border-radius: 6px; overflow: hidden; }

        .swal2-popup { border: 4px solid #000 !important; border-radius: 20px !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="display: flex; align-items: center; gap: 15px;">
        <a href="index.html" class="btn-home">🏠 หน้าหลัก</a>
        <!-- ดึงข้อมูลชื่อผู้ใช้จริงจากระบบฐานข้อมูลเดิม -->
        <div id="displayUserName" class="user-stat">LOADING...</div>
    </div>
    <!-- ดึงข้อมูลเพชรจริงจากระบบฐานข้อมูลเดิม -->
    <div class="user-stat">💎 <span id="nav-diamonds">0</span></div>
</nav>

<div class="main-layout">
    <!-- บล็อกฝั่งซ้าย: ตัวแสดงสินค้าประมูล -->
    <div class="game-panel">
        <div id="timer" class="timer-banner">00:00</div>
        
        <div class="card-frame">
            <img id="cardImg" src="" alt="Premium Card">
        </div>
        
        <h2 id="cardName" style="font-size: 1.6rem; font-weight:900; margin: 10px 0 5px 0; text-align:center;">---</h2>
        <div id="rarityTag" class="rarity-tag">...</div>
        
        <!-- ข้อมูลของรางวัลใบถัดไปเสิร์ฟต่อเนื่องตามโค้ดเดิม -->
        <div class="next-card-panel">
            <div class="next-frame">
                <img id="nextCardImg" src="" style="width:100%; height:100%; object-fit:cover;">
            </div>
            <div>
                <div style="font-size:0.8rem; color:#666; font-weight:bold;">ถัดไปในคิว...</div>
                <div id="nextCardName" style="font-weight:900; color:#ff9000; font-size:0.95rem;">LOADING</div>
            </div>
        </div>
    </div>

    <!-- บล็อกฝั่งขวา: คอนโซลปุ่มควบคุมสู้ราคาและจัดอันดับบิดเกอร์ -->
    <div class="game-panel">
        <div class="section-title">⚔️ ENTER TO WIN!</div>
        
        <div class="pool-stats">
            <div style="font-size: 1rem; font-weight:bold; color: #555;">💰 มูลค่ากองกลางรอบนี้</div>
            <div style="font-size: 2.3rem; font-weight: 900; color: #ff9000;">💎 <span id="totalPool">0</span></div>
            <div style="font-size: 0.9rem; font-weight:bold; margin-top: 4px;">คุณลงสะสมแล้ว: <span id="myTotalBid" style="color: #2ed573;">0</span> 💎</div>
        </div>

        <input type="number" id="bidAmount" class="bid-input" placeholder="ใส่จำนวนเพชรที่จะเพิ่ม">
        <button class="btn-bid" onclick="placeBid()">ยืนยันส่งเพชรประมูล</button>
        
        <!-- ปุ่มเพิ่มราคาด่วนอ้างอิงจากแถบปุ่มกดด้านล่างในรูปภาพต้นฉบับ -->
        <div class="quick-bid-container">
            <button class="btn-quick" onclick="addQuickAmount(10)">+10</button>
            <button class="quick-btn btn-quick" onclick="addQuickAmount(50)">+50</button>
            <button class="quick-btn btn-quick" onclick="addQuickAmount(100)">+100</button>
            <button class="quick-btn btn-quick" onclick="addQuickAmount(500)">+500</button>
        </div>

        <div style="width:100%; font-weight:bold; font-size:0.95rem; margin-bottom:8px;">
            🔥 ประวัติผู้เข้าร่วมสู้ราคาล่าสุด (<span id="totalBidders">0</span> คน):
        </div>
        
        <!-- ตารางแสดงชื่อประวัติคนบิดล่าสุดที่ดึงมาจากฐานข้อมูล -->
        <div class="history-box" id="winnerList">
            <div style="color: #888; text-align: center; padding-top: 20px;">กำลังโหลดประวัติ...</div>
        </div>
        
        <div style="margin-top: 15px; font-size: 0.9rem; font-weight:bold; color: #444; text-align:center; width:100%;">
            โอกาสชนะของคุณในรอบนี้คำนวณเป็น: <span id="myChance" style="color: #2ed573; font-size:1.1rem; font-weight:900;">0%</span>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment, arrayUnion, setDoc, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ใช้ Firebase config ชุดเดียวกับระบบหลักของคุณ[cite: 8]
    const firebaseConfig = { 
        apiKey: "AIzaSyCLgMyUiSZcIdBXnefK3SHQiVpSaBm8xoM", 
        authDomain: "sign-up-73f99.firebaseapp.com", 
        projectId: "sign-up-73f99", 
        storageBucket: "sign-up-73f99.appspot.com", 
        messagingSenderId: "916335559099", 
        appId: "1:916335559099:web:3a8ed896ba26e38991849e" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ดึงเซ็ตสีและข้อมูลลิสต์ของรางวัลจริงตามโค้ดต้นฉบับของคุณครบถ้วน[cite: 8]
    const rarityColors = { 'USEC': '#ff00ff', 'EXR': '#ff4d4d', 'SEC': '#ffac33', 'SSR': '#ffc831', 'SR': '#33aaff' };
    const rarityAssets = {
        'USEC': { name: 'เอรา นาคเกล็ดเขียว (USEC)', img: 'https://cdn.bangbon.app/cards/SL02-009.png' },
        'EXR':  { name: 'White Lily (EXR)', img: 'https://cookierunbraverse.com/data/en_storage/olOZiU0Y2v2FxOl6yWDUrQ.webp' },
        'SEC':  { name: 'Moon Rabbit Cookie (SEC)', img: 'https://cookierunbraverse.com/data/en_storage/ZiH3DAYad38ydqqiRu6M4w.webp' },
        'SSR':  { name: 'Herb Cookie (SSR)', img: 'https://cookierunbraverse.com/data/en_storage/QhXEdn1RHleo_rigjpY2AQ.webp' },
        'SR':   { name: 'Herb Cookie (SR)', img: 'https://cookierunbraverse.com/data/en_storage/slT6LU8WmAEuGLM8kH5XYQ.webp' }
    };

    let currentUID = null;
    let userData = null;
    let auctionData = null;
    let isProcessing = false;

    function getRandomRarity() {
        const roll = Math.random() * 100;
        if (roll <= 5) return 'USEC';   
        if (roll <= 10) return 'EXR';  
        if (roll <= 20) return 'SEC';  
        if (roll <= 30) return 'SSR';  
        return 'SR';                   
    }

    // ดึงข้อมูลผู้ใช้จาก Firestore ของจริงมาผูกเข้ากับ UI หน้าเว็บ[cite: 8]
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUID = user.uid;
            onSnapshot(doc(db, "users", currentUID), (snap) => {
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById("displayUserName").innerText = userData.username || "PLAYER";
                    document.getElementById("nav-diamonds").innerText = (userData.diamonds || 0).toLocaleString();
                }
            });
        } else { window.location.href = "login.html"; }
    });

    onSnapshot(doc(db, "auctions", "current"), (snap) => {
        if (snap.exists()) {
            auctionData = snap.data();
            renderAuction();
        }
    });

    // ดึงข้อมูลรายชื่อประวัติผู้ร่วมบิดของจริงแบบเรียลไทม์[cite: 8]
    onSnapshot(query(collection(db, "winnerLogs"), orderBy("time", "desc"), limit(5)), (snap) => {
        const list = document.getElementById("winnerList");
        list.innerHTML = "";
        if (snap.empty) {
            list.innerHTML = `<div style="color: #666; font-size: 0.85rem; text-align: center; padding: 10px;">ไม่มีข้อมูลประวัติล่าสุุด...</div>`;
            return;
        }
        snap.forEach(doc => {
            const d = doc.data();
            list.innerHTML += `<div class="history-item">
                <span>👤 ${d.username}</span>
                <span style="color:${rarityColors[d.rarity] || '#000'}">[${d.rarity}] CARD</span>
            </div>`;
        });
    });

    // เรนเดอร์การแสดงผลการ์ดและผลรวมเพชรกองกลาง[cite: 8]
    function renderAuction() {
        if (!auctionData) return;
        const currentR = auctionData.rarity || 'SR';
        const asset = rarityAssets[currentR] || rarityAssets['SR'];
        document.getElementById("cardImg").src = asset.img;
        document.getElementById("cardName").innerText = asset.name;
        
        const rTag = document.getElementById("rarityTag");
        rTag.innerText = currentR;
        rTag.style.backgroundColor = rarityColors[currentR] || "#eee";

        const nextR = (auctionData.nextCard && auctionData.nextCard.rarity) ? auctionData.nextCard.rarity : 'SSR';
        const nextAsset = rarityAssets[nextR] || rarityAssets['SSR'];
        document.getElementById("nextCardImg").src = nextAsset.img;
        document.getElementById("nextCardName").innerText = nextAsset.name;

        const participants = auctionData.participants || [];
        const totalBid = participants.reduce((sum, p) => sum + p.bid, 0);
        const myTotalBid = participants.filter(p => p.uid === currentUID).reduce((s, p) => s + p.bid, 0);
        
        document.getElementById("totalPool").innerText = totalBid.toLocaleString();
        document.getElementById("myTotalBid").innerText = myTotalBid.toLocaleString();
        document.getElementById("totalBidders").innerText = participants.length;
        document.getElementById("myChance").innerText = totalBid > 0 ? ((myTotalBid/totalBid)*100).toFixed(1) + "%" : "0%";
    }

    // ฟังก์ชันช่วยเซ็ตค่าปุ่มเพิ่มราคาด่วน
    window.addQuickAmount = (amount) => {
        const bidInput = document.getElementById("bidAmount");
        const currentVal = parseInt(bidInput.value) || 0;
        bidInput.value = currentVal + amount;
    };

    // ส่งข้อมูลราคาประมูลอัปเดตหักเพชรจริงบนระบบ Firestore[cite: 8]
    window.placeBid = async () => {
        const amount = parseInt(document.getElementById("bidAmount").value);
        if (!amount || amount <= 0 || userData.diamonds < amount) return Swal.fire('ผิดพลาด', 'เพชรไม่พอหรือระบุจำนวนผิด', 'error');
        try {
            await updateDoc(doc(db, "users", currentUID), { diamonds: increment(-amount) });
            await updateDoc(doc(db, "auctions", "current"), {
                participants: arrayUnion({ uid: currentUID, name: userData.username, bid: amount })
            });
            Swal.fire({ title: 'ส่งแต้มสู้ราคาสำเร็จ!', icon: 'success', timer: 1000, showConfirmButton: false });
            document.getElementById("bidAmount").value = "";
        } catch (e) { console.error(e); }
    };

    // Logic จัดการเมื่อหมดเวลารอบประมูล[cite: 8]
    async function handleEndAuction(data) {
        if (isProcessing) return;
        isProcessing = true;
        
        const participants = data.participants || [];
        if (participants.length > 0) {
            let pool = [];
            participants.forEach(p => { for(let i = 0; i < p.bid; i++) pool.push(p.uid); });
            const winnerIdx = Math.floor(Math.random() * pool.length);
            const winnerUid = pool[winnerIdx];
            const winnerInfo = participants.find(p => p.uid === winnerUid);

            await setDoc(doc(collection(db, "winnerLogs")), {
                username: winnerInfo.name,
                rarity: data.rarity,
                time: Date.now()
            });

            if (currentUID === winnerUid) {
                const asset = rarityAssets[data.rarity] || rarityAssets['SR'];
                const uniqueId = Date.now().toString() + "_" + Math.random().toString(36).substr(2, 5);
                
                await updateDoc(doc(db, "users", winnerUid), {
                    collection: arrayUnion({ 
                        id: uniqueId,
                        name: asset.name, 
                        rarity: data.rarity, 
                        img: asset.img, 
                        level: 1, 
                        stars: 0, 
                        obtainedAt: Date.now() 
                    })
                });
                
                Swal.fire({
                    title: `🎊 ยินดีด้วยคุณชนะได้รับ!`,
                    html: `<img src="${asset.img}" style="width:180px; border-radius:10px; margin:15px 0;"><br>ได้รับ: ${asset.name}`,
                    background: '#fff',
                    color: '#000',
                    confirmButtonText: 'เก็บเข้าคลังการ์ด'
                });
            }
        }

        const nextRarity = (data.nextCard && data.nextCard.rarity) ? data.nextCard.rarity : getRandomRarity();
        const futureRarity = getRandomRarity();

        await setDoc(doc(db, "auctions", "current"), {
            rarity: nextRarity,
            endTime: Date.now() + 600000, 
            participants: [],
            nextCard: { rarity: futureRarity }
        });
        
        isProcessing = false;
    }

    setInterval(() => {
        if (!auctionData) return;
        const remain = auctionData.endTime - Date.now();
        if (remain <= 0) {
            handleEndAuction(auctionData);
        } else {
            const m = Math.floor(remain / 60000);
            const s = Math.floor((remain % 60000) / 1000);
            document.getElementById("timer").innerText = `${m}:${s.toString().padStart(2,'0')}`;
        }
    }, 1000);
</script>
</body>
</html>
