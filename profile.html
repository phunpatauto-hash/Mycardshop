<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Hub - Card Collector Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #ffc831;
            --accent: #00e5ff;
            --bg-dark: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --theme-glow: conic-gradient(from 0deg, transparent, rgba(255,200,49,0.05), transparent);
        }

        * { box-sizing: border-box; transition: all 0.25s ease; }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg-dark); 
            color: white; margin: 0; min-height: 100vh;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(255, 200, 49, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(0, 229, 255, 0.08) 0%, transparent 40%);
        }

        .container { max-width: 1100px; margin: auto; padding: 20px; opacity: 0; transform: scale(0.98); }
        .container.show { opacity: 1; transform: scale(1); }

        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { 
            background: var(--card-bg); border: 1px solid var(--glass-border); color: #fff;
            padding: 8px 20px; border-radius: 12px; text-decoration: none; display: flex; align-items: center; gap: 10px;
            font-size: 0.9rem; backdrop-filter: blur(10px); cursor: pointer;
        }
        .back-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px rgba(255,200,49,0.3); }

        /* --- Hero Profile Section --- */
        .hero-section {
            display: grid; grid-template-columns: 280px 1fr 220px; gap: 30px;
            background: rgba(27, 41, 46, 0.877);
            border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 35px; backdrop-filter: blur(20px);
            margin-bottom: 40px; position: relative; overflow: hidden;
        }

        .hero-section::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: var(--theme-glow);
            animation: rotate 10s linear infinite; pointer-events: none;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* Avatar */
        .pfp-container { position: relative; z-index: 2; justify-self: center; }
        .pfp-frame {
            width: 180px; height: 180px; border-radius: 40px; padding: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pfp-frame img { width: 100%; height: 100%; border-radius: 32px; object-fit: cover; background: #111; }
        
        .pfp-edit {
            position: absolute; bottom: 10px; right: 10px;
            background: #fff; color: #000; width: 35px; height: 35px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .pfp-edit:hover { background: var(--primary); transform: scale(1.1); }

        /* User Info & LEVEL System */
        .user-main { z-index: 2; align-self: center; }
        .name-wrapper { display: flex; align-items: center; gap: 12px; margin-top: 5px; flex-wrap: wrap; }
        .user-main h1 { font-size: 2.5rem; margin: 0; letter-spacing: 2px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-edit-name { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 1.2rem; opacity: 0.6; }
        .btn-edit-name:hover { opacity: 1; transform: scale(1.1); }
        .uid-tag { color: var(--primary); font-size: 0.8rem; opacity: 0.7; font-family: monospace; }
        
        /* สไตล์กล่องหลอดเลเวล */
        .level-wrapper { margin-top: 15px; width: 100%; max-width: 450px; background: rgba(0,0,0,0.4); padding: 12px 18px; border-radius: 16px; border: 1px solid var(--glass-border); cursor: pointer; }
        .level-wrapper:hover { border-color: var(--accent); background: rgba(0,0,0,0.6); }
        .level-header-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
        .level-lbl { color: var(--accent); letter-spacing: 1px; }
        .level-exp-text { color: #aaa; font-size: 0.75rem; }
        .level-bar-container { width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .level-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffc831, #00e5ff); border-radius: 10px; box-shadow: 0 0 10px rgba(0,229,255,0.5); }

        /* ฉายา ออร่าทองเรืองแสง */
        .whale-title-banner {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 165, 0, 0.2) 100%);
            border: 1px solid rgba(255, 215, 0, 0.5); color: #ffd700;
            padding: 5px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: bold; margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
            animation: titlePulse 2s infinite alternate;
        }
        .whale-title-banner.rank-pro { background: linear-gradient(135deg, rgba(255, 0, 255, 0.2) 0%, rgba(255, 51, 51, 0.2) 100%); border: 1px solid rgba(255, 0, 255, 0.5); color: #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.4); text-shadow: 0 0 5px rgba(255, 0, 255, 0.6); }
        .whale-title-banner.rank-master { background: linear-gradient(135deg, rgba(255, 200, 49, 0.2) 0%, rgba(255, 144, 0, 0.2) 100%); border: 1px solid rgba(255, 144, 0, 0.5); color: #ff9000; box-shadow: 0 0 15px rgba(255, 144, 0, 0.4); text-shadow: 0 0 5px rgba(255, 144, 0, 0.6); }
        .whale-title-banner.rank-level-traveler { background: linear-gradient(135deg, rgba(0, 229, 255, 0.2) 0%, rgba(0, 102, 255, 0.2) 100%); border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); text-shadow: 0 0 5px rgba(0, 229, 255, 0.6); }
        
        .whale-title-banner.rank-supreme-guardian { 
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.35) 0%, rgba(255, 69, 0, 0.45) 50%, rgba(255, 0, 128, 0.35) 100%); 
            border: 1px solid #ffd700; color: #fff; 
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 10px rgba(255, 69, 0, 0.6); 
            text-shadow: 0 0 8px #ff4500, 0 0 12px #ffd700; font-weight: 800;
        }

        .whale-title-banner.rank-party-diamonds { 
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.35) 0%, rgba(138, 43, 226, 0.45) 50%, rgba(0, 255, 204, 0.35) 100%); 
            border: 1px solid #00e5ff; color: #fff; 
            box-shadow: 0 0 22px rgba(0, 229, 255, 0.85), 0 0 12px rgba(138, 43, 226, 0.6); 
            text-shadow: 0 0 8px #00ffff, 0 0 14px #8a2be2; font-weight: 800;
        }

        .whale-title-banner.rank-rainbow-ultimate {
            background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 600% 600%; border: 2px solid rgba(255, 255, 255, 0.8); color: #ffffff; font-weight: 900;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.9);
            animation: rainbowAnimation 6s ease infinite, titlePulse 2s infinite alternate;
        }
        
        .whale-title-banner.rank-auction-starter {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 100, 255, 0.3) 100%);
            border: 1px solid #00d2ff; color: #00d2ff; box-shadow: 0 0 18px rgba(0, 210, 255, 0.5); text-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
        }
        .whale-title-banner.rank-auction-pro {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.3) 0%, rgba(255, 60, 0, 0.35) 100%);
            border: 1px solid #ff8c00; color: #ffb700; box-shadow: 0 0 20px rgba(255, 140, 0, 0.6); text-shadow: 0 0 6px rgba(255, 140, 0, 0.7);
        }
        .whale-title-banner.rank-auction-god {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.4) 0%, rgba(255, 0, 128, 0.4) 100%);
            border: 2px solid #ffd700; color: #ffffff; font-weight: 900;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.85); text-shadow: 0 0 8px #ff007f, 0 0 12px #ffd700;
        }

        @keyframes rainbowAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes titlePulse { from { transform: scale(1); } to { transform: scale(1.02); } }

        .max-rank-banner { display: inline-flex; align-items: center; gap: 6px; background: rgba(230, 57, 70, 0.15); border: 1px solid rgba(230, 57, 70, 0.4); color: #ff4d6d; padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; margin-top: 8px; }
        .last-rank-banner { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.3); color: #00e5ff; padding: 4px 12px; border-radius: 50px; font-size: 0.8rem; font-weight: bold; margin-top: 8px; margin-left: 8px; }

        /* Featured Showcase Slot */
        .featured-display { z-index: 2; background: rgba(0,0,0,0.5); border-radius: 25px; border: 2px dashed var(--glass-border); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .featured-display img { width: 100%; height: 100%; object-fit: cover; }
        .featured-label { position: absolute; top: 10px; background: var(--primary); color: #000; font-size: 0.6rem; font-weight: 800; padding: 2px 10px; border-radius: 5px; }

        /* --- Collection --- */
        .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0 10px; }
        .section-title h2 { font-size: 1.4rem; margin: 0; font-weight: 300; letter-spacing: 1px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding-bottom: 100px; }
        .card-item { background: var(--card-bg); border-radius: 24px; padding: 12px; border: 1px solid var(--glass-border); position: relative; cursor: pointer; text-align: center; }
        .card-item:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(255,255,255,0.08); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .card-item img { width: 100%; border-radius: 18px; aspect-ratio: 2/3; object-fit: cover; margin-bottom: 12px; }
        .card-info .name { font-size: 0.85rem; font-weight: 400; margin-bottom: 8px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rarity-pill { font-size: 0.65rem; font-weight: 800; padding: 3px 12px; border-radius: 8px; display: inline-block; letter-spacing: 1px; text-transform: uppercase; }
        
        .rarity-SECRET { background: #D8BFD8; color: #000; }
        .rarity-P, .rarity-USEC { background: #ff00ff; color: #fff; }
        .rarity-EXR, .rarity-CBR { background: linear-gradient(45deg, #ff0055, #ffdd00); color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
        .rarity-SEC { background: #ffac33; color: #000; }
        .rarity-SUR { background: #33ffad; color: #000; }
        .rarity-SSR, .rarity-PR { background: var(--primary); color: #000; }
        .rarity-UR { background: #bf40bf; color: #fff; }
        .rarity-SR { background: var(--accent); color: #000; }
        .rarity-R { background: #33ff57; color: #000; }
        .rarity-U, .rarity-C { background: #ffffff; color: #000; }

        .lvl-tag { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); font-size: 0.6rem; padding: 2px 8px; border-radius: 5px; color: var(--primary); border: 1px solid var(--primary); z-index: 5; }
        .qty-badge { position: absolute; top: -5px; right: -5px; background: #fff; color: #000; width: 24px; height: 24px; border-radius: 50%; font-size: 0.7rem; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 10px rgba(0,0,0,0.3); z-index: 5; }

        /* Loader */
        #loader { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(255,200,49,0.1); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Scrollbar inside SweetAlert */
        .title-scroll-box::-webkit-scrollbar { width: 8px; }
        .title-scroll-box::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        .title-scroll-box::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .title-scroll-box::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        @media (max-width: 900px) {
            .hero-section { grid-template-columns: 1fr; text-align: center; padding: 30px; }
            .featured-display { height: 250px; width: 180px; margin: 20px auto 0; }
            .last-rank-banner { margin-left: 0; }
        }

        .pfp-frame.blue-luxury-frame { background: linear-gradient(135deg, #00d4ff, #0077ff, #00ff87); background-size: 300% 300%; animation: rotateFrameGradient 4s ease infinite; box-shadow: 0 0 25px rgba(30, 218, 255, 0.87); }
        @keyframes rotateFrameGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>

        if (user) {
            userUID = user.uid;

                    await updateDoc(doc(db, "users", userUID), {

                    });

                    console.error("Error updating play count:", err);
                }

                if (snap.exists()) {
                    const userData = snap.data();
                    globalUserData = userData;

                    updateUI(userData);
                    updateProfileUI(userData);
                    updatePlayerLevelUI(userData);

    async function uploadImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 800000) return alert("ไฟล์ต้องมีขนาดไม่เกิน 800KB");

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async () => {
            await updateDoc(doc(db, "users", userUID), { userPhoto: reader.result });
            Swal.fire({
                icon: 'success',
                title: 'อัปโหลดรูปโปรไฟล์สำเร็จ!',
                timer: 1000,
                showConfirmButton: false,
                background: '#1a1a1c',
                color: '#fff'
            });
        };
    }

    async function checkAndProcessLevelUp(uid, data) {
        let currentLv = parseInt(data.playerLevel) || 1;
        let currentExp = parseInt(data.playerExp) || 0;
        let reqExp = getRequiredExpForLevel(currentLv);
        let updated = false;

        while (currentExp >= reqExp) {
            currentExp -= reqExp;
            currentLv += 1;
            if (currentLv > 50) {
                currentLv = 50;
                currentExp = reqExp;
                break;
            }
            reqExp = getRequiredExpForLevel(currentLv);
            updated = true;
        }

        if (updated) {
            await updateDoc(doc(db, "users", uid), {
                playerLevel: currentLv,
                playerExp: currentExp
            });
        }
    }

        document.getElementById("player-exp-display").innerText = lv >= 50 ? `MAX LEVEL` : `EXP ${currentExp.toLocaleString()} / ${maxExp.toLocaleString()}`;

                    name: 'ผู้ใหญ่ใจบุญ',
                    isUnlocked: isWhale || unlockedTitles.includes("ผู้ใหญ่ใจบุญ"),
                    desc: 'ปลดล็อกจากแพ็กเกจผู้ใหญ่ใจบุญ หรือการสนับสนุนระบบ'
                }
            ];

            let titleListHTML = `
                <div style="text-align: left; margin-bottom: 12px;">
                    <div style="font-weight: bold; color: #ffc831; margin-bottom: 6px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px;">
                        <i class="fas fa-hand-pointer"></i> คลิกที่ชื่อยศด้านล่างเพื่อสวมใส่ทันที:
                    </div>
                </div>
                <div class="title-scroll-box" style="max-height: 320px; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 10px;">
            `;

            allTitlesMasterList.forEach(t => {
                const statusColor = t.isUnlocked ? '#22c55e' : '#ef4444';
                const statusIcon = t.isUnlocked ? 'fa-unlock' : 'fa-lock';
                const statusText = t.isUnlocked ? 'ปลดล็อกแล้ว' : 'ยังไม่ได้ปลดล็อก';
                
                const clickAction = t.isUnlocked ? `onclick="selectAndEquipTitle('${t.id}')"` : `onclick="Swal.fire('ยังไม่ได้ปลดล็อก', 'ยศนี้ยังไม่ผ่านเงื่อนไขการปลดล็อก', 'warning')"`;
                const hoverStyle = t.isUnlocked ? `cursor: pointer;` : `opacity: 0.6; cursor: not-allowed;`;

                titleListHTML += `
                    <div ${clickAction} style="background: #121214; border: 1px solid ${t.isUnlocked ? 'rgba(34,197,94,0.4)' : '#27272a'}; border-radius: 12px; padding: 12px; ${hoverStyle} transition: all 0.2s;" onmouseover="this.style.borderColor='#ffc831'" onmouseout="this.style.borderColor='${t.isUnlocked ? 'rgba(34,197,94,0.4)' : '#27272a'}';">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                            <span style="font-weight: bold; color: ${t.isUnlocked ? '#ffc831' : '#ffffff'}; font-size: 1rem;">🏷️ ${t.name}</span>
                            <span style="color: ${statusColor}; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 4px;">
                                <i class="fas ${statusIcon}"></i> ${statusText}
                            </span>
                        </div>
                        <div style="color: #9ca3af; font-size: 0.8rem; line-height: 1.4; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 8px; border-left: 3px solid ${t.isUnlocked ? '#22c55e' : '#ef4444'};">
                            💡 <b>เงื่อนไข:</b> ${t.desc}
                        </div>
                    </div>
                `;
            });

            titleListHTML += `</div>`;

            Swal.fire({
                title: '👑 เลือกฉายา / ยศของคุณ',
                html: titleListHTML,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'ปิดหน้าต่าง',
                background: '#18181b',
                color: '#fff',
                cancelButtonColor: '#4b5563'
            });

        } catch (error) {
            console.error(error);
            Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลคลังฉายาได้', 'error');
        }
    };

    window.selectAndEquipTitle = async (titleId) => {
        if (!userUID) return;
        try {
            await updateDoc(doc(db, "users", userUID), { currentTitle: titleId });
            Swal.fire({
                icon: 'success',
                title: 'สวมใส่ฉายาเรียบร้อย!',
                timer: 1000,
                showConfirmButton: false,
                background: '#18181b',
                color: '#fff'
            });
        } catch (err) {
            console.error(err);
            Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเปลี่ยนยศได้', 'error');
        }
    };
    
    window.editUsername = async () => {
        const { value: newName } = await Swal.fire({
            title: 'เปลี่ยนชื่อผู้เล่น',
            input: 'text',
            inputLabel: 'ใส่ชื่อใหม่ของคุณ (ไม่เกิน 15 ตัวอักษร)',
            inputValue: document.getElementById("username-display").innerText,
            showCancelButton: true,
            background: '#1a1a1c',
            color: '#fff',
            confirmButtonColor: '#ffc831',
            inputAttributes: { maxlength: 15 }
        });

        if (newName && newName.trim() !== "") {
            await updateDoc(doc(db, "users", userUID), { username: newName.trim() });
        }
    };

    function updateUI(data) {
        document.getElementById("username-display").innerText = data.username || "COLLECTOR";
        
        const titleContainer = document.getElementById("whale-title-container");
        const titleBanner = document.getElementById("whale-title-banner-main");
        
        if (data.currentTitle && data.currentTitle !== "none") {
            document.getElementById("whale-title-text").innerText = data.currentTitle;
            titleContainer.style.display = "block";
            
            titleBanner.classList.remove("rank-pro", "rank-master", "rank-level-traveler", "rank-supreme-guardian", "rank-party-diamonds", "rank-rainbow-ultimate", "rank-auction-starter", "rank-auction-pro", "rank-auction-god");
            
            if (data.currentTitle === "นักประมูลผู้ชนะตลอดกาล") {
                titleBanner.classList.add("rank-auction-god");
            } else if (data.currentTitle === "นักประมูลชำนาญ") {
                titleBanner.classList.add("rank-auction-pro");
            } else if (data.currentTitle === "นักประมูลเริ่ม") {
                titleBanner.classList.add("rank-auction-starter");
            } else if (data.currentTitle === "นักเดินทางเลเวลขั้นสุดยอด") {
                titleBanner.classList.add("rank-rainbow-ultimate");
            } else if (data.currentTitle === "DIAMONDS") {
                titleBanner.classList.add("rank-party-diamonds");
            } else if (data.currentTitle === "ผู้พิทักษ์อารีน่าแห่งนี้") {
                titleBanner.classList.add("rank-supreme-guardian");
            } else if (data.currentTitle === "นักสู้ผู้ไม่ย่อท้อ") {
                titleBanner.classList.add("rank-pro");
            } else if (data.currentTitle === "ผู้พิชิตศึกสงคราม") {
                titleBanner.classList.add("rank-master");
            } else if (data.currentTitle === "ผู้เดินทางเลเวลชำนาน" || data.currentTitle === "นักเดินทางเลเวล") {
                titleBanner.classList.add("rank-level-traveler");
            }
        } else {
            titleContainer.style.display = "none";
        }

        const avatar = document.getElementById("user-avatar");
        avatar.src = data.userPhoto || `https://api.dicebear.com/7.x/avataaars/svg?seed=${data.username}`;

        const feat = document.getElementById("featured-card");
        if (data.featuredCard && data.featuredCard.img) {
            feat.innerHTML = `<img src="${data.featuredCard.img}"><span class="featured-label">FEATURED</span>`;
            feat.style.borderColor = data.featuredCard.rarity === 'EXR' ? '#ff0055' : 'var(--primary)';
        } else {
            feat.innerHTML = `<i class="fas fa-plus" style="opacity: 0.2; font-size: 2rem;"></i><span class="featured-label">SHOWCASE</span>`;
            feat.style.borderColor = "var(--glass-border)";
        }

        const collection = data.collection || [];
        document.getElementById("collection-count").innerText = `${collection.length} CARDS`;
        
        const grid = document.getElementById("card-grid");
        if (collection.length === 0) {
            grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; opacity:0.3; padding:50px;">ยังไม่มีการ์ดในครอบครอง</p>`;
            return;
        }

        const grouped = {};
        collection.forEach(c => {
            const rStyle = (c.rarity || 'C').toUpperCase();
            const key = `${c.name}_${rStyle}`;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(c);
        });

        let displayList = [];
        for (const key in grouped) {
            const copies = grouped[key];
            copies.sort((a, b) => {
                const lvA = parseInt(a.level || a.lv || 1);
                const lvB = parseInt(b.level || b.lv || 1);
                const starA = parseInt(a.stars || 0);
                const starB = parseInt(b.stars || 0);
                return (starB * 100 + lvB) - (starA * 100 + lvA);
            });
            const bestCard = copies[0];
            displayList.push({ ...bestCard, finalLv: parseInt(bestCard.level || bestCard.lv || 1), qty: copies.length });
        }

        displayList.sort((a, b) => {
            const rA = (a.rarity || 'C').toUpperCase();
            const rB = (b.rarity || 'C').toUpperCase();
            const orderA = rarityOrder[rA] || 0;
            const orderB = rarityOrder[rB] || 0;
            if (orderB !== orderA) return orderB - orderA;
            return b.finalLv - a.finalLv;
        });

        grid.innerHTML = displayList.map(c => {
            const rDisplay = (c.rarity || 'C').toUpperCase();
            return `
                <div class="card-item" onclick="setFeatured('${c.img || c.image || ''}', '${rDisplay}', '${(c.name || 'Unknown').replace(/'/g, "\\'")}', ${c.atk || 0}, ${c.def || 0})">
                    <div class="lvl-tag">LV.${c.finalLv}</div>
                    ${c.qty > 1 ? `<div class="qty-badge">x${c.qty}</div>` : ''}
                    <img src="${c.img || c.image || ''}" onerror="this.src='https://via.placeholder.com/150x225?text=Card'">
                    <div class="card-info">
                        <div class="name">${c.name}</div>
                        <div class="rarity-pill rarity-${rDisplay}">${rDisplay}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.setFeatured = async (img, rarity, name, atk, def) => {
        if (!img) return;
        const result = await Swal.fire({
            title: 'ตั้งค่าการ์ดโชว์',
            text: `ต้องการนำการ์ด "${name}" ใบนี้ไปตั้งเป็นหน้าตาทับโปรไฟล์หลักของคุณใช่หรือไม่?`,
            icon: 'question',
            showCancelButton: true,
            background: '#1a1a1c',
            color: '#fff',
            confirmButtonColor: '#ffc831'
        });

        if (result.isConfirmed) {
            const cardPayload = { img, rarity, name, atk, def };
            await updateDoc(doc(db, "users", userUID), { featuredCard: cardPayload, decoratedCard: cardPayload });
        }
    };

    function hideLoader() {
        const loader = document.getElementById("loader");
        loader.style.opacity = "0";
        setTimeout(() => {
            loader.style.display = "none";
            document.getElementById("main-content").classList.add("show");
        }, 500);
    }

    window.logout = () => {
        if(confirm("ออกจากระบบใช่หรือไม่?")) signOut(auth).then(() => location.href = "login.html");
    };
</script>

</body>
</html>
