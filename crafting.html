    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUid = user.uid;
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    globalUserData = data;

                    document.getElementById("profile-container").style.display = "flex";
                    document.getElementById("user-display").innerText = data.username;
                    document.getElementById("user-points").innerText = (data.points || 0).toLocaleString();
                    document.getElementById("user-diamonds").innerText = (data.diamonds || 0).toLocaleString();
                    document.getElementById("user-ticket-normal").innerText = (data.normal_tickets || 0).toLocaleString();
                    document.getElementById("user-ticket-premium").innerText = (data.premium_tickets || 0).toLocaleString();
                    
                    if (data.userPhoto) {
                        document.getElementById("nav-avatar-img").src = data.userPhoto;
                    } else {
                        document.getElementById("nav-avatar-img").src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${data.username}`;
                    }

                    renderCraftingRecipes();
                }
            });
            document.getElementById("auth-btn").innerText = "ออกจากระบบ";
            document.getElementById("auth-btn").onclick = () => signOut(auth).then(()=>location.reload());
            document.getElementById("redeem-tab").style.display = "block";
        } else {
            alert("กรุณาเข้าสู่ระบบก่อนใช้งานหน้าคราฟต์");
            window.location.href = "login.html";
        }
    });

    function renderCraftingRecipes() {
        if (!globalUserData) return;
        craftingContainer.innerHTML = "";

        if(craftRecipes.length === 0) {
            craftingContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">ไม่มีรายการคราฟต์ในขณะนี้</div>`;
            return;
        }

        craftRecipes.forEach(recipe => {
            let canCraft = true;
            let recipeItemsMarkup = "";

            if (recipe.costPoints > 0) {
                const hasPoints = (globalUserData.points || 0) >= recipe.costPoints;
                if (!hasPoints) canCraft = false;
                recipeItemsMarkup += `
                    <div class="recipe-item">
                        <span>🪙 ทองที่ใช้</span>
                        <span class="${hasPoints ? 'status-valid' : 'status-invalid'}">
                            ${(globalUserData.points || 0).toLocaleString()} / ${recipe.costPoints.toLocaleString()}
                        </span>
                    </div>
                `;
            }

            Object.keys(recipe.reqMaterials).forEach(matKey => {
                const req = recipe.reqMaterials[matKey];
                let currentOwnQty = 0;

                if (req.isNested) {
                    if (globalUserData.materials && globalUserData.materials[req.keyPath]) {
                        currentOwnQty = globalUserData.materials[req.keyPath].qty || 0;
                    }
                } else {
                    currentOwnQty = globalUserData[matKey] || 0;
                }

                const hasEnoughMat = currentOwnQty >= req.amount;
                if (!hasEnoughMat) canCraft = false;

                recipeItemsMarkup += `
                    <div class="recipe-item">
                        <span>📦 ${req.name}</span>
                        <span class="${hasEnoughMat ? 'status-valid' : 'status-invalid'}">
                            ${currentOwnQty.toLocaleString()} / ${req.amount.toLocaleString()}
                        </span>
                    </div>
                `;
            });

            const card = document.createElement("div");
            card.className = "craft-card";

            card.innerHTML = `
                <div>
                    <div class="craft-target">
                        <div class="target-icon" style="${recipe.styleClass}"><i class="${recipe.icon}"></i></div>
                        <div class="target-info">
                            <h3 style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
                                ${recipe.name}
                                ${recipe.rarity ? `<span class="rarity-badge rarity-${recipe.rarity}">${recipe.rarityLabel}</span>` : ''}
                            </h3>
                            <p>${recipe.desc}</p>
                        </div>
                    </div>
                    <div class="recipe-section">
                        <div class="recipe-title">วัตถุดิบที่ต้องการ</div>
                        ${recipeItemsMarkup}
                    </div>
                </div>
                <button class="btn-craft" ${!canCraft ? 'disabled' : ''} id="btn-${recipe.id}">
                    ${canCraft ? '⚒️ เริ่มกระบวนการคราฟต์' : '❌ วัตถุดิบไม่เพียงพอ'}
                </button>
            `;

            card.querySelector(`#btn-${recipe.id}`).addEventListener("click", () => {
                executeCraft(recipe);
            });

            craftingContainer.appendChild(card);
        });
    }

    async function executeCraft(recipe) {
        if (!currentUserUid || !globalUserData) return;

        const confirmAction = confirm(`คุณต้องการใช้ทรัพยากรเพื่อคราฟต์ "${recipe.name}" ใช่หรือไม่?`);
        if (!confirmAction) return;

        try {
            const userRef = doc(db, "users", currentUserUid);
            let updatePayload = {};

            if (recipe.costPoints > 0) {
                updatePayload["points"] = increment(-recipe.costPoints);
            }

            Object.keys(recipe.reqMaterials).forEach(matKey => {
                const req = recipe.reqMaterials[matKey];
                updatePayload[matKey] = increment(-req.amount);
            });

            if (recipe.isNestedMaterial) {
                const baseField = recipe.rewardField.replace(".qty", "");
                updatePayload[`${baseField}.name`] = recipe.rewardName;
                updatePayload[`${baseField}.desc`] = recipe.rewardDesc;
                updatePayload[recipe.rewardField] = increment(recipe.rewardQty);
            } else {
                updatePayload[recipe.rewardField] = increment(recipe.rewardQty);
            }

            await updateDoc(userRef, updatePayload);
            alert(`⚒️ คราฟต์สำเร็จ! คุณได้รับ "${recipe.name}" เรียบร้อยแล้ว สามารถตรวจสอบได้ที่หน้ากระเป๋าของคุณ`);

        } catch (error) {
            console.error("Crafting Error:", error);
            alert("เกิดข้อผิดพลาดในการคราฟต์ไอเทม กรุณาลองใหม่อีกครั้ง");
        }
    }
