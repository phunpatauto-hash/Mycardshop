        if (!userData) return;
        document.getElementById("balance").innerText = (userData.points || 0).toLocaleString();
        document.getElementById("user-diamonds").innerText = (userData.diamonds || 0).toLocaleString();

        document.getElementById("pity-bar-sec").style.width = (Math.min(ps, 550) / 550 * 100) + "%";

        // ดึงจำนวนเงินและตั๋วปัจจุบันจากก้อน object

        let premiumTickets = userData.premium_tickets || 0;

        // ประกาศตัวแปรฟิลด์ที่จะใช้สำหรับส่งอัปเดตไปที่ Firebase

        let costPoints = 0;
        let passExpGained = amount === 5 ? 50 : (amount === 50 ? 1500 : 1000); // แต้ม Pass เดิม

        // คำนวณ EXP ประจำเลเวลที่จะได้รับตามโจทย์ (5 ครั้ง=10, 10 ครั้ง=50, 50 ครั้ง=100)
        let playerExpGained = 0;
        if (amount === 5) playerExpGained = 10;
        else if (amount === 10) playerExpGained = 50;
        else if (amount === 50) playerExpGained = 100;

        // ==================== 🎫 ระบบคำนวณและเช็คเงื่อนไขตั๋วสุ่ม 🎫 ====================
        if (amount === 5) {

                updateFields["normal_tickets"] = increment(-10);

            } else {
                costPoints = 100;
                if (currentPoints < costPoints) return alert("แต้มหรือตั๋วสุ่มของคุณไม่เพียงพอ!");
                updateFields["points"] = increment(-costPoints);
            }
        } 
        else if (amount === 10) {
            if (normalTickets >= 15) {
                updateFields["normal_tickets"] = increment(-15);
            } else if (premiumTickets >= 10) {
                updateFields["premium_tickets"] = increment(-10);
            } else {
                costPoints = 500;
                if (currentPoints < costPoints) return alert("แต้มหรือตั๋วสุ่มของคุณไม่เพียงพอ!");
                updateFields["points"] = increment(-costPoints);
            }
        } 
        else if (amount === 50) {
            if (normalTickets >= 30) {
                updateFields["normal_tickets"] = increment(-30);
            } else if (premiumTickets >= 20) {
                updateFields["premium_tickets"] = increment(-20);
            } else {
                costPoints = 1000;
                if (currentPoints < costPoints) return alert("แต้มหรือตั๋วสุ่มของคุณไม่เพียงพอ!");
                updateFields["points"] = increment(-costPoints);
            }
        }

        // เริ่มต้นอนิเมชั่นการสุ่ม
        isPulling = true; toggleButtons(true);
        const display = document.getElementById("display");
        display.innerHTML = "";
        
        const results = [];
        let ps = userData.pitySEC || 0, pe = userData.pityEXR || 0;
        const totalWeight = allCards.reduce((s, c) => s + c.rate, 0);

        for (let i = 0; i < amount; i++) {
            ps++; pe++;
            let win = null;
            if (pe >= 900) { win = allCards.filter(c => c.rarity === "EXR")[0]; pe = 0; }
            else if (ps >= 550) { win = allCards.filter(c => c.rarity === "SEC")[0]; ps = 0; }
            else {
                let r = Math.random() * totalWeight, curr = 0;
                for (const c of allCards) { curr += c.rate; if (r <= curr) { win = c; break; } }
            }
            if (win.rarity === "SEC") ps = 0;
            if (win.rarity === "EXR") { pe = 0; ps = 0; }

            results.push({ name: win.name, rarity: win.rarity, img: win.img, obtainedDate: Date.now(), level: 1, source: "Gacha ตู้ที่ 1" });
            const cardEl = document.createElement("div");
            cardEl.className = "card";
            cardEl.innerHTML = `<div class="card-inner"><div class="card-front"><img src="${win.img}"></div><div class="card-back"></div></div>`;
            display.appendChild(cardEl);
            setTimeout(() => cardEl.classList.add("revealed"), i * 150);

            if (win.rarity === "EXR") await playEXRCutscene();
            else if (["SEC", "SUR", "SSR", "UR"].includes(win.rarity)) triggerShake();
        }

        // --- คำนวณประมวลผลระบบเลเวลผู้เล่น (Player Level Update Loop) ---
        let finalPlayerLv = parseInt(userData.playerLevel) || 1;
        let finalPlayerExp = parseInt(userData.playerExp) || 0;
        finalPlayerExp += playerExpGained;
        let isLeveledUp = false;

        while (finalPlayerExp >= getRequiredExpForLevel(finalPlayerLv)) {
            finalPlayerExp -= getRequiredExpForLevel(finalPlayerLv);
            finalPlayerLv++;
            isLeveledUp = true;
        }

        // อัปเดตข้อมูล Pity, EXP และคลังการ์ดเข้าก้อนที่จะส่งอัปเดตไป Firebase
        updateFields["pitySEC"] = ps;
        updateFields["pityEXR"] = pe;
        updateFields["passExp"] = increment(passExpGained);
        updateFields["playerLevel"] = finalPlayerLv;
        updateFields["playerExp"] = finalPlayerExp;
        updateFields["collection"] = arrayUnion(...results);

        // บันทึกการเปลี่ยนแปลงลงฐานข้อมูล Firebase คราวเดียว
        await updateDoc(doc(db, "users", currentUserUID), updateFields);
        
        isPulling = false; toggleButtons(false);

        // แสดงแจ้งเตือน SweetAlert2 เมื่อเลเวลอัปสำเร็จแบบเรียลไทม์
        if (isLeveledUp) {
            Swal.fire({
                title: '🎉 ยินดีด้วย เลเวลอัปแล้ว! 🎉',
                html: `<div style="font-size: 1.2rem; margin: 10px 0;">คุณได้เลื่อนระดับเป็น <span style="color: #00e5ff; font-weight: bold; font-size: 1.6rem;">LV. ${finalPlayerLv}</span></div>
                       <p style="color: #aaa; font-size: 0.9rem;">กลับไปที่หน้าโปรไฟล์หลักเพื่อกดรับไอเทมของรางวัลประจำเลเวลได้เลย!</p>`,
                icon: 'success',
                background: '#1a1a1c',
                color: '#fff',
                confirmButtonColor: '#ffc831',
                confirmButtonText: 'รับทราบ!',
                backdrop: `rgba(0,0,0,0.8)`
            });
        }
    }

    async function playEXRCutscene() {
        const overlay = document.getElementById("cutscene-overlay");
        overlay.style.display = "flex";
        await new Promise(r => setTimeout(r, 1200));
        overlay.style.display = "none";
        const flash = document.createElement("div"); flash.className="exr-flash";
        document.body.appendChild(flash); setTimeout(() => flash.remove(), 800);
    }

    function triggerShake() {
        document.body.classList.add("shake-heavy");
        setTimeout(() => document.body.classList.remove("shake-heavy"), 500);
    }

    function toggleButtons(d) {
        document.getElementById("pull-5").disabled = d;
        document.getElementById("pull-10").disabled = d;
        document.getElementById("pull-50").disabled = d;
    }

    window.openModal = () => {
        const body = document.getElementById("rate-list-body");
        body.innerHTML = allCards.map(c => `
            <tr>
                <td><img src="${c.img}" class="modal-card-img"></td>
                <td>
                    <div style="font-weight:bold; color: ${getRarityColor(c.rarity)};">[${c.rarity}]</div>
                    <div style="font-size: 0.9rem;">${c.name}</div>
                </td>
                <td style="text-align:right; font-weight:bold; color:#ffc831;">${c.rate}%</td>
            </tr>
        `).join('');
        document.getElementById("rateModal").style.display = "block";
    }

    window.closeModal = () => document.getElementById("rateModal").style.display = "none";

    function getRarityColor(rarity) {
        const colors = { 
            EXR: '#00d4ff', 
            SEC: '#a020f0', 
            SUR: '#ff4500', 
            UR: '#39ff14', 
            SSR: '#ff4444', 
            SR: '#ffc831',
            R: '#007bff' 
        };
        return colors[rarity] || '#aaaaaa';
    }

    const track = document.getElementById("v-track");
    const rares = allCards.filter(c => ["EXR", "SEC", "SUR", "UR", "SSR", "R"].includes(c.rarity));
    track.innerHTML = [...rares, ...rares].map(c => `<div class="preview-card-item"><img src="${c.img}"></div>`).join('');
</script>
</body>
</html>
